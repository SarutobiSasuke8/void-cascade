<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VOID CASCADE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05010A;
    overflow: hidden;
    font-family: 'Orbitron', system-ui, sans-serif;
    color: #00F5FF;
    user-select: none;
    -webkit-user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #05010A;
    box-shadow: 0 0 80px rgba(0, 245, 255, 0.15);
  }
  #ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(26,10,46,0.85) 0%, rgba(5,1,10,0.95) 70%);
    pointer-events: auto;
    transition: opacity 0.4s ease;
  }
  #menu {
    background:
      radial-gradient(ellipse at center, rgba(5,1,10,0.10) 0%, rgba(5,1,10,0.42) 58%, rgba(5,1,10,0.78) 100%),
      url('../assets/backgrounds/menu_home.png') center / cover no-repeat;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .logo {
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    background: linear-gradient(90deg, #00F5FF, #FF00AA, #00F5FF);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s linear infinite;
    text-shadow: 0 0 40px rgba(0,245,255,0.5);
    margin-bottom: 0.3em;
  }
  #menu .logo {
    width: min(72vw, 560px);
    margin-bottom: 0.15rem;
    background: none;
    animation: none;
    text-shadow: none;
  }
  #menu .logo img {
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 0 22px rgba(0, 245, 255, 0.25));
  }
  @keyframes shimmer {
    to { background-position: 200% center; }
  }
  .tagline {
    font-size: 0.9rem;
    letter-spacing: 0.4em;
    color: #3A7BFF;
    margin-bottom: 3rem;
    opacity: 0.8;
  }
  .btn {
    background: transparent;
    border: 2px solid #00F5FF;
    color: #00F5FF;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 0.9rem 2.8rem;
    margin: 0.6rem;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn:hover, .btn:focus {
    background: rgba(0,245,255,0.15);
    box-shadow: 0 0 30px rgba(0,245,255,0.4);
    transform: scale(1.05);
  }
  .btn.secondary {
    border-color: #3A7BFF;
    color: #3A7BFF;
    font-size: 0.85rem;
    padding: 0.6rem 1.8rem;
  }
  .btn.secondary:hover {
    background: rgba(58,123,255,0.15);
    box-shadow: 0 0 20px rgba(58,123,255,0.3);
  }
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 1.2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    font-size: 0.95rem;
    letter-spacing: 0.1em;
  }
  .hud-left, .hud-right { display: flex; flex-direction: column; gap: 0.3rem; }
  .score { font-size: 1.6rem; font-weight: 700; color: #00F5FF; text-shadow: 0 0 12px #00F5FF; }
  .lives { display: flex; justify-content: flex-end; align-items: center; gap: 4px; min-height: 22px; }
  .life-ship { width: 23px; height: 23px; object-fit: contain; filter: drop-shadow(0 0 3px rgba(0,245,255,0.45)); }
  .lives-empty { color: #FF00AA; }
  .wave { color: #3A7BFF; }
  .shield-bar {
    width: 120px; height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }
  .shield-fill {
    height: 100%;
    background: linear-gradient(90deg, #3A7BFF, #00F5FF);
    width: 0%;
    transition: width 0.15s;
  }
  #pauseHint {
    position: absolute;
    bottom: 1.5rem;
    font-size: 0.7rem;
    opacity: 0.4;
    letter-spacing: 0.15em;
  }
  #audioHint {
    position: absolute;
    bottom: 3.2rem;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    color: #FFD23F;
    animation: hintPulse 1.6s ease-in-out infinite;
  }
  @keyframes hintPulse { 50% { opacity: 0.35; } }
  .torpedoes { display: flex; justify-content: flex-end; gap: 3px; min-height: 18px; margin-top: 3px; }
  .torpedo-icon { width: 18px; height: 18px; object-fit: contain; transform: rotate(-90deg); filter: drop-shadow(0 0 3px rgba(255,138,36,0.55)); }
  #hudMult { color: #FFD23F; text-shadow: 0 0 12px #FFD23F; font-size: 1.05rem; margin-left: 0.4rem; }
  #hudMult.blink { animation: multBlink 0.4s steps(2) infinite; }
  @keyframes multBlink { 50% { opacity: 0.25; } }
  .weapons { font-size: 0.6rem; letter-spacing: 0.18em; color: #00F5FF; opacity: 0.85; min-height: 0.8em; }
  /* Wave tally and reward toasts live in the DOM, not on the game canvas.
     Drawn to the canvas they went through the bloom pass, which blew the
     letterforms out — measured 12-13% fully-saturated pixels either way, so a
     dark outline could not rescue them. As DOM they sit after postfx and stay
     crisp, with a controlled CSS glow instead of an uncontrolled bloom. */
  #waveTally {
    position: absolute;
    top: 17%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 8;
  }
  #waveTally.show { opacity: 1; }
  .wt-title {
    font-size: clamp(1.5rem, 3.6vw, 2.4rem);
    font-weight: 900;
    letter-spacing: 0.2em;
    color: #D6F9FF;
    text-shadow: 0 0 16px rgba(0,245,255,0.5), 0 2px 7px rgba(0,0,0,0.95);
  }
  .wt-bonus {
    margin-top: 0.3rem;
    font-size: clamp(0.95rem, 2vw, 1.4rem);
    font-weight: 700;
    letter-spacing: 0.16em;
    color: #FFD23F;
    text-shadow: 0 0 13px rgba(255,210,63,0.45), 0 2px 6px rgba(0,0,0,0.95);
  }
  #toastLayer {
    position: absolute;
    left: 50%;
    top: 63%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    pointer-events: none;
    z-index: 8;
  }
  .toast {
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    white-space: nowrap;
    text-shadow: 0 0 11px currentColor, 0 2px 6px rgba(0,0,0,0.95);
    animation: toastRise 2.5s ease-out forwards;
  }
  @keyframes toastRise {
    0%   { opacity: 0; transform: translateY(10px); }
    10%  { opacity: 1; transform: translateY(0); }
    72%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-16px); }
  }
  /* Sci-fi cockpit frame. Pure CSS overlay: pointer-events none so it can never
     block the playfield, and only a few px deep at the extreme edges. */
  #hudFrame { position: absolute; inset: 0; pointer-events: none; z-index: 9; }
  .hf-corner {
    position: absolute; width: 34px; height: 34px; opacity: 0.6;
    filter: drop-shadow(0 0 6px rgba(0,245,255,0.55));
  }
  .hf-corner.tl { top: 8px; left: 8px; border-top: 2px solid #00F5FF; border-left: 2px solid #00F5FF; }
  .hf-corner.tr { top: 8px; right: 8px; border-top: 2px solid #00F5FF; border-right: 2px solid #00F5FF; }
  .hf-corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid #00F5FF; border-left: 2px solid #00F5FF; }
  .hf-corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid #00F5FF; border-right: 2px solid #00F5FF; }
  .hf-edge { position: absolute; opacity: 0.45; }
  .hf-edge.top, .hf-edge.bottom { left: 18%; right: 18%; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,245,255,0.5), transparent); }
  .hf-edge.top { top: 8px; }
  .hf-edge.bottom { bottom: 8px; }
  .hf-edge.left, .hf-edge.right { top: 24%; bottom: 24%; width: 1px; background: linear-gradient(180deg, transparent, rgba(0,245,255,0.5), transparent); }
  .hf-edge.left { left: 8px; }
  .hf-edge.right { right: 8px; }
  .highscores {
    max-height: 40vh;
    overflow-y: auto;
    margin: 1.5rem 0;
    width: min(90vw, 360px);
  }
  .hs-row {
    display: flex;
    justify-content: space-between;
    padding: 0.4rem 1rem;
    border-bottom: 1px solid rgba(0,245,255,0.15);
    font-size: 0.9rem;
  }
  .hs-row:nth-child(1) { color: #00F5FF; font-weight: 700; }
  .kid-toggle {
    margin-top: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 0.85rem;
    color: #3A7BFF;
  }
  .kid-toggle input { accent-color: #00F5FF; width: 18px; height: 18px; }
  .menu-board {
    width: min(88vw, 320px);
    border: 1px solid rgba(0,245,255,0.25);
    background: rgba(0,245,255,0.04);
    padding: 0.7rem 0.4rem;
    margin-bottom: 1.6rem;
  }
  .menu-board-title {
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    color: #3A7BFF;
    text-align: center;
    margin-bottom: 0.4rem;
  }
  .menu-board .hs-row { font-size: 0.8rem; padding: 0.25rem 0.8rem; }
  .bindlist {
    width: min(90vw, 400px);
    margin: 1.2rem 0 0.6rem;
  }
  .bind-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.35rem 0.6rem;
    border-bottom: 1px solid rgba(0,245,255,0.12);
  }
  .bind-name { font-size: 0.8rem; letter-spacing: 0.15em; color: #aaa; }
  .bindkey {
    pointer-events: auto;
    background: rgba(0,245,255,0.06);
    border: 1px solid rgba(0,245,255,0.45);
    color: #00F5FF;
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 0.28rem 0.7rem;
    margin-left: 0.45rem;
    min-width: 3.6rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .bindkey:hover { background: rgba(0,245,255,0.18); box-shadow: 0 0 12px rgba(0,245,255,0.35); }
  .bindkey.listening {
    border-color: #FF00AA;
    color: #FF00AA;
    animation: listenPulse 0.8s ease-in-out infinite;
  }
  @keyframes listenPulse {
    50% { background: rgba(255,0,170,0.18); }
  }
  .bindhint { font-size: 0.65rem; letter-spacing: 0.15em; opacity: 0.45; margin-bottom: 0.8rem; }
  .go-hint {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    color: #FFD23F;
    min-height: 1.2em;
    margin-bottom: 1rem;
  }
  .name-entry { display: flex; align-items: center; margin-bottom: 1.2rem; }
  .name-entry.hidden { display: none; }
  .name-entry input {
    pointer-events: auto;
    background: rgba(0,245,255,0.06);
    border: 1px solid rgba(0,245,255,0.45);
    color: #00F5FF;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.7rem 1rem;
    width: 12.5rem;
    outline: none;
  }
  .name-entry input:focus { box-shadow: 0 0 18px rgba(0,245,255,0.35); }
  .name-entry input::placeholder { color: rgba(0,245,255,0.35); letter-spacing: 0.2em; }
  #fxLabel {
    position: absolute;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    color: #00F5FF;
    text-shadow: 0 0 12px #00F5FF;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="c"></canvas>
  <div id="fxLabel"></div>
  <div id="ui">
    <div id="menu" class="screen">
      <div class="logo"><img src="../assets/ui/void_cascade_banner.png" alt="VOID CASCADE"></div>
      <div class="tagline">SHATTER THE VOID</div>
      <div class="menu-board">
        <div class="menu-board-title">TOP PILOTS</div>
        <div id="menuScores"></div>
      </div>
      <button class="btn" id="btnPlay">PLAY</button>
      <button class="btn secondary" id="btnScores">HIGH SCORES</button>
      <button class="btn secondary" id="btnControls">CONTROLS</button>
      <div class="kid-toggle">
        <input type="checkbox" id="kidMode">
        <label for="kidMode">KID MODE (easier)</label>
      </div>
      <div id="audioHint">CLICK OR PRESS ANY KEY FOR SOUND</div>
      <div id="pauseHint">ESC / START to pause • Gamepad supported</div>
    </div>
    <div id="scores" class="screen hidden">
      <div class="logo" style="font-size:2.5rem">HIGH SCORES</div>
      <div class="highscores" id="hsList"></div>
      <button class="btn secondary" id="btnBackScores">BACK</button>
    </div>
    <div id="controls" class="screen hidden">
      <div class="logo" style="font-size:2.2rem">CONTROLS</div>
      <div id="bindList" class="bindlist"></div>
      <div class="bindhint">Click a key to rebind it • B toggles bloom • M toggles sound • Gamepad supported</div>
      <button class="btn secondary" id="btnResetBinds">RESET TO DEFAULTS</button>
      <button class="btn secondary" id="btnBackControls">BACK</button>
    </div>
    <div id="pause" class="screen hidden">
      <div class="logo" style="font-size:3rem">PAUSED</div>
      <button class="btn" id="btnResume">RESUME</button>
      <button class="btn secondary" id="btnQuit">QUIT TO MENU</button>
    </div>
    <div id="gameover" class="screen hidden">
      <div class="logo" style="font-size:2.8rem">CASCADE COMPLETE</div>
      <div class="score" id="finalScore" style="margin:1rem 0 0.4rem">0</div>
      <div id="goHint" class="go-hint"></div>
      <div id="nameEntry" class="name-entry hidden">
        <input type="text" id="nameInput" maxlength="12" placeholder="PILOT NAME" autocomplete="off" spellcheck="false">
        <button class="btn secondary" id="btnSaveScore">SAVE</button>
      </div>
      <button class="btn" id="btnRetry">TRY AGAIN</button>
      <button class="btn secondary" id="btnMenu">MAIN MENU</button>
    </div>
    <div id="waveTally" aria-live="polite">
      <div class="wt-title" id="wtTitle">WAVE 1 CLEAR</div>
      <div class="wt-bonus" id="wtBonus">BONUS +0</div>
    </div>
    <div id="toastLayer" aria-live="polite"></div>
    <div class="hud hidden" id="hud">
      <div class="hud-left">
        <div class="score"><span id="hudScore">0</span><span id="hudMult"></span></div>
        <div class="wave" id="hudWave">WAVE 1</div>
        <div class="weapons" id="hudWeapons"></div>
      </div>
      <div class="hud-right">
        <div class="lives" id="hudLives" aria-label="3 ships remaining"><img class="life-ship" src="../assets/ships/player_default.png" alt=""><img class="life-ship" src="../assets/ships/player_default.png" alt=""><img class="life-ship" src="../assets/ships/player_default.png" alt=""></div>
        <div style="font-size:0.62rem; letter-spacing:0.2em; color:#FF8A24; margin-top:5px; text-align:right;">TORPEDO</div>
        <div class="torpedoes" id="hudTorpedoes" aria-label="3 torpedoes"></div>
        <div style="font-size:0.6rem; letter-spacing:0.25em; color:#3A7BFF; margin-top:4px;">SHIELD</div>
        <div class="shield-bar"><div class="shield-fill" id="shieldFill"></div></div>
      </div>
    </div>
  </div>
  <div id="hudFrame" aria-hidden="true">
    <div class="hf-corner tl"></div><div class="hf-corner tr"></div>
    <div class="hf-corner bl"></div><div class="hf-corner br"></div>
    <div class="hf-edge top"></div><div class="hf-edge bottom"></div>
    <div class="hf-edge left"></div><div class="hf-edge right"></div>
  </div>
</div>

<script src="postfx.js"></script>
<script>
// VOID CASCADE — Browser Prototype
// Full modern particle-hybrid Asteroids remake
// (core gameplay + visual juice preserved from design)
//
// Rendering is two-stage: all gameplay draws into an offscreen 2D canvas,
// which is then pushed through the WebGL bloom pipeline in postfx.js and
// composited to the visible canvas. Game code below draws exactly as before.
const display = document.getElementById('c');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const postfx = createPostFX(display, canvas);

// Generated art is intentionally optional: the procedural renderers remain a
// graceful fallback if a local browser blocks image loading from file://.
const SPRITES = {
  player: new Image(),
  asteroid: new Image(),
  riftStalker: new Image(),
  shieldPickup: new Image(),
  rapidPickup: new Image(),
  torpedo: new Image()
};
SPRITES.player.src = '../assets/ships/player_default.png';
SPRITES.asteroid.src = '../assets/asteroids/large/asteroid_01.png';
SPRITES.riftStalker.src = '../assets/enemies/rift_stalker_01.png';
SPRITES.shieldPickup.src = '../assets/powerups/shield_charge.png';
SPRITES.rapidPickup.src = '../assets/powerups/rapid_fire.png';
SPRITES.torpedo.src = '../assets/weapons/torpedo.png';
const spriteSafety = new WeakMap();
function spriteReady(sprite) {
  if (!sprite.complete || sprite.naturalWidth <= 0) return false;
  // The local server is the supported playable route. Its assets are same
  // origin, so use them directly rather than falling back to the old Canvas
  // drawings. Only direct file:// launches need the taint-safety probe below.
  if (location.protocol !== 'file:') return true;
  if (spriteSafety.has(sprite)) return spriteSafety.get(sprite);
  // Canvas images loaded from a file URL can be cross-origin in some embedded
  // previews. Probe a disposable canvas first so they never taint the gameplay
  // source canvas and halt the WebGL post-processing frame.
  const probe = document.createElement('canvas');
  probe.width = probe.height = 1;
  try {
    const probeCtx = probe.getContext('2d');
    probeCtx.drawImage(sprite, 0, 0, 1, 1);
    probeCtx.getImageData(0, 0, 1, 1);
    spriteSafety.set(sprite, true);
  } catch (error) {
    spriteSafety.set(sprite, false);
    console.warn('Sprite disabled because this preview cannot safely upload it:', sprite.src, error);
  }
  return spriteSafety.get(sprite);
}

// Bloom is expensive at 4K. Cap the internal buffer so high-DPI screens do not
// tank the frame rate; the upscale is invisible under this much glow.
const MAX_PIXELS = 2100000;

let W = 0, H = 0, CX = 0, CY = 0;
function resize() {
  // Floor at 1x1. A page loaded in a background tab or a not-yet-laid-out
  // container reports 0, which would silently leave a zero-size canvas and a
  // black screen with no error.
  const w = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
  const h = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
  const scale = Math.min(1, Math.sqrt(MAX_PIXELS / (w * h)));
  const nw = Math.max(1, Math.floor(w * scale));
  const nh = Math.max(1, Math.floor(h * scale));
  if (nw === W && nh === H) return;
  W = canvas.width = display.width = nw;
  H = canvas.height = display.height = nh;
  display.style.width = w + 'px';
  display.style.height = h + 'px';
  CX = W / 2; CY = H / 2;
  postfx.resize(W, H);
}
window.addEventListener('resize', resize);
// The resize event does not fire when a hidden container is first laid out, so
// observe the container directly as well.
if (window.ResizeObserver) {
  new ResizeObserver(resize).observe(document.getElementById('gameContainer'));
}
resize();

// Look tuning, all in one place. Exposed on window so it can be adjusted live
// from the console without a reload: BLOOM.intensity = 2 and so on.
const BLOOM = window.BLOOM = {
  intensity: 1.6,   // how much of the bloom buffer is added back
  threshold: 0.40,  // brightness above which a pixel contributes glow
  knee: 0.15,       // softness of that cutoff; MUST stay below threshold, or
                    // the background itself leaks into the bloom and washes out
  radius: 1.0,      // tent filter spread during upsample; widens the halo
  aberration: 0.005,
  vignette: 0.5,
  kneeStart: 0.9,   // highlights below this are passed through untouched
  enabled: true     // toggled live with B, for A/B comparison
};

// Reused per-colour buckets for particle drawing. Allocated once so the render
// path does not create garbage every frame.
const particleBuckets = new Map();

const State = { MENU:0, PLAY:1, PAUSE:2, GAMEOVER:3, SCORES:4, CONTROLS:5 };
let state = State.MENU;
let kidMode = false;
let score = 0, lives = 3, wave = 1;
// Score multiplier from ×2 pickups: applies to every score gain, drops back to
// ×1 when its timer runs out, and is lost with the ship.
let scoreMult = 1, multTimer = 0;
const MULT_MAX = 5, MULT_DURATION = 720;   // 12s at 60Hz ticks
// Extra ships are a milestone, not an income stream: the first costs 50k and
// every one after that costs 60% more, so late-game scores cannot farm lives.
const LIFE_FIRST = 50000, LIFE_GROWTH = 1.6;
const MAX_LIVES = 9;                       // HUD row and difficulty both stop making sense past this
let nextLifeScore = LIFE_FIRST, lifeStep = LIFE_FIRST;
const MAX_WEAPON_STACK = 3;
const SHIP_SCALE = 1.18;   // visual only — collision radius stays 14 (forgiving hitbox)
let displayedLives = null;
function renderLives() {
  if (displayedLives === lives) return;
  displayedLives = lives;
  const hudLives = document.getElementById('hudLives');
  hudLives.setAttribute('aria-label', `${Math.max(0, lives)} ships remaining`);

// ---- Audio: fully procedural WebAudio, zero asset files ----
// Everything is synthesised so the game keeps working straight off the

// called from the first click/keypress and every play() call is a no-op until
// then. M mutes, persisted in localStorage.
const AudioFX = (() => {
  let ac = null, master, sfx, musGain;
  let noiseBuf, thrustGain, thrustLow, thrustMid, thrustSub;
  let verb, shaperCurve;

  let musicOn = false;

  // Theme music: a real track routed through the same master/mute graph as
  // the sound effects rather than the old procedural synth loop.
  const musicEl = new Audio('../assets/audio/void_cascade_theme.mp3');
  musicEl.loop = true;

function pollGamepad() {
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = gps[0];
  if (!gp) return;
  gamepad.axes[0] = Math.abs(gp.axes[0]) > 0.2 ? gp.axes[0] : 0;
  gamepad.axes[1] = Math.abs(gp.axes[1]) > 0.2 ? gp.axes[1] : 0;
  gamepad.buttons = {};

// Particles are pooled and budgeted. Measured on 2026-08-07: clearing one
// large asteroid's full split chain emits ~870 particles, so eight rocks dying
// together produced ~7000 in a single frame — 15ms of draw plus the GC churn
// of allocating and splicing that many objects, which is what made late waves
// stutter. Pooling removes the allocation, swap-remove kills the O(n) splice,
// and the budget thins simultaneous bursts instead of dropping frames.
const particles = [];
const particlePool = [];
const PARTICLE_SOFT = 1400;   // bursts begin thinning here
const PARTICLE_CAP = 2400;    // absolute ceiling
// 1 while there is room, easing to 0 as the field fills. A single explosion is
// never thinned; only overlapping ones are.
function particleBudget() {
  if (particles.length <= PARTICLE_SOFT) return 1;
  const room = PARTICLE_CAP - particles.length;
  return room <= 0 ? 0 : room / (PARTICLE_CAP - PARTICLE_SOFT);
}
function emit(x, y, vx, vy, life, maxLife, size, color) {
  const p = particlePool.pop() || { x:0, y:0, vx:0, vy:0, life:0, maxLife:1, size:1, color:'#fff' };
  p.x = x; p.y = y; p.vx = vx; p.vy = vy;
  p.life = life; p.maxLife = maxLife; p.size = size; p.color = color;
  particles.push(p);
}
function spawnParticles(x, y, count, color, speed=3, life=40, size=3) {
  const budget = particleBudget();
  if (budget <= 0) return;
  const n = budget < 1 ? Math.max(1, Math.round(count * budget)) : count;
  for (let i=0; i<n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.4 + Math.random()*0.8);
    emit(x, y, Math.cos(a)*s, Math.sin(a)*s, life * (0.6 + Math.random()*0.5), life, size * (0.5 + Math.random()), color);
  }
}
function spawnTrail(x, y, angle, color) {
  if (particles.length >= PARTICLE_CAP) return;
  emit(x - Math.cos(angle)*12, y - Math.sin(angle)*12, (Math.random()-0.5)*0.8, (Math.random()-0.5)*0.8,

}
function updateParticles() {
  const drag = Math.pow(0.98, dt);
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= drag; p.vy *= drag;
    p.life -= dt;
    if (p.life <= 0) {
      // Swap-remove: O(1) instead of splice's memmove. Iterating downwards
      // means the element swapped in was already processed this frame.
      const last = particles.pop();
      if (i < particles.length) particles[i] = last;
      if (particlePool.length < PARTICLE_CAP) particlePool.push(p);
    }

}
// One filled arc per particle, batched by colour.
//
// The original drew two arcs each: a core plus a larger, dimmer disc faking a
// halo. That fake is now redundant because the bloom pass produces a real one,
// so dropping it is both cheaper and better looking. Grouping by colour also
// collapses per-particle fillStyle changes down to one per colour per frame.
// Measured at roughly twice the throughput of the original at 1000-2000
// particles, which is what pays for the denser bursts.
function drawParticles() {
  if (!particles.length) return;
  for (const list of particleBuckets.values()) list.length = 0;
  for (const p of particles) {
    let list = particleBuckets.get(p.color);
    if (!list) { list = []; particleBuckets.set(p.color, list); }
    list.push(p);
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const [colour, list] of particleBuckets) {
    if (!list.length) continue;
    ctx.fillStyle = colour;
    for (const p of list) {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha * 0.95;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.5 + alpha * 0.8), 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

const stars = [];
for (let i=0; i<180; i++) {
  stars.push({ x: Math.random(), y: Math.random(), z: Math.random()*3 + 0.3, size: Math.random()*1.6 + 0.3 });
}
const nebulaBlobs = [];
for (let i=0; i<8; i++) {
  nebulaBlobs.push({ x: Math.random()*W, y: Math.random()*H, r: 120 + Math.random()*200, vx: (Math.random()-0.5)*0.15, vy: (Math.random()-0.5)*0.15, hue: 260 + Math.random()*40 });
}
// Scroll accumulator rather than raw frame count, so parallax speed is also
// frame-rate independent.
let bgScroll = 0;

function drawBackground() {
  bgScroll += dt;
  ctx.fillStyle = '#05010A';
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const n of nebulaBlobs) {
    n.x += n.vx * dt; n.y += n.vy * dt;
    if (n.x < -n.r) n.x = W+n.r;
    if (n.x > W+n.r) n.x = -n.r;
    if (n.y < -n.r) n.y = H+n.r;
    if (n.y > H+n.r) n.y = -n.r;
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, `hsla(${n.hue},70%,40%,0.12)`);
    g.addColorStop(0.5, `hsla(${n.hue},60%,25%,0.05)`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // Faint scrolling grid. Without a fixed reference the playfield reads as a
  // flat void and the ship looks like it is sliding on glass; the grid gives
  // motion something to register against. Kept under the bloom threshold so it
  // never glows and never competes with gameplay elements.
  const cell = 90;
  const ox = (bgScroll * 0.18) % cell;
  const oy = (bgScroll * 0.09) % cell;
  ctx.save();
  ctx.strokeStyle = '#3A7BFF';
  ctx.globalAlpha = 0.055;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = -ox; x < W + cell; x += cell) {
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  for (let y = -oy; y < H + cell; y += cell) {
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();
  ctx.restore();

  for (const s of stars) {
    const px = (s.x * W + bgScroll * 0.02 * s.z) % W;
    const py = (s.y * H + bgScroll * 0.01 * s.z) % H;
    ctx.globalAlpha = 0.3 + s.z * 0.25;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px, py, s.size * s.z * 0.4, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Weapon power-ups live in `weapons` as stack counts (0–MAX_WEAPON_STACK).

const player = { x: 0, y: 0, angle: -Math.PI/2, vx: 0, vy: 0, radius: 14, thrust: false, fireCooldown: 0, invuln: 0, shield: 0, maxShield: 100, weapons: { rapid: 0, spread: 0, pierce: 0 }, torpedoes: 3, torpedoHeld: false };
function resetPlayer() {
  player.x = CX; player.y = CY;

  player.weapons.rapid = player.weapons.spread = player.weapons.pierce = 0;

function updatePlayer() {

  player.angle += rot * 0.085 * dt;
  player.thrust = down('thrust') || gamepad.buttons[0] || gamepad.buttons[7];
  if (player.thrust) {
    const force = 0.18;
    player.vx += Math.cos(player.angle) * force * dt;
    player.vy += Math.sin(player.angle) * force * dt;

    // whether the display is 60Hz or 144Hz. Exhaust is rocket fire: white-hot
    // pops nearest the nozzle, orange body, red tail-off.
    const puffs = Math.max(1, Math.round(dt));
    for (let i = 0; i < puffs; i++) {
      const r = Math.random();
      const c = r < 0.15 ? '#FFFFFF' : r < 0.45 ? '#FFD23F' : r < 0.8 ? '#FF7A00' : '#FF3C00';
      spawnTrail(player.x, player.y, player.angle, c);

    }

  const sp = Math.hypot(player.vx, player.vy);

  const firePressed = down('fire') || gamepad.buttons[1] || gamepad.buttons[2];
  if (firePressed && player.fireCooldown <= 0) {
    const w = player.weapons;
    // Each RAPID stack multiplies the refire delay down: 12 → 7.4 → 4.6 → 2.9.
    player.fireCooldown = 12 * Math.pow(0.62, w.rapid);
    const speed = 11;
    // SPREAD stacks widen the fan: 1 → 3 → 5 → 7 bullets.
    const shots = w.spread > 0 ? w.spread * 2 + 1 : 1;
    const step = 0.13;
    for (let s = 0; s < shots; s++) {
      const ang = player.angle + (s - (shots - 1) / 2) * step;
      bullets.push({ x: player.x + Math.cos(ang)*18, y: player.y + Math.sin(ang)*18, vx: Math.cos(ang)*speed + player.vx*0.3, vy: Math.sin(ang)*speed + player.vy*0.3, life: 55, fromPlayer: true, pierce: w.pierce });

const bullets = [];

const asteroids = [];
// Armour, not attrition. Wave difficulty used to come purely from spawning more
// rocks, which is the expensive axis: every extra large rock is 7 entities and
// ~870 particles once its split chain finishes. Hardening rocks instead keeps
// late waves dangerous while the on-screen count stays bounded.
// Kid Mode never gets armour.
function armorFor(size, w) {
  if (kidMode) return 1;
  const tier = Math.min(3, Math.floor(Math.max(0, w - 4) / 3));  // 0 up to wave 6, then 1/2/3
  if (size === 3) return 1 + tier;             // 1..4 hits
  if (size === 2) return tier >= 2 ? 2 : 1;    // mediums harden late only
  return 1;                                     // smalls are always one-shot
}
// Fissures in unit space so they tumble with the rock. Only armoured rocks
// draw them; they brighten as the armour is worn down.
function generateCracks(n) {
  const cracks = [];
  for (let i = 0; i < n; i++) {
    cracks.push({
      a: Math.random() * Math.PI * 2,
      r0: 0.08 + Math.random() * 0.12,
      r1: 0.75 + Math.random() * 0.2,
      wob: (Math.random() - 0.5) * 0.55
    });
  }
  return cracks;
}
function spawnAsteroid(x, y, size, speedMult=1) {
  const angle = Math.random()*Math.PI*2;
  const speed = (0.6 + Math.random()*1.2) * speedMult * (kidMode ? 0.7 : 1);
  const hp = armorFor(size, wave);
  asteroids.push({ x: x ?? Math.random()*W, y: y ?? Math.random()*H, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, size, radius: size === 3 ? 42 : size === 2 ? 24 : 12, rot: Math.random()*Math.PI*2, rotSpeed: (Math.random()-0.5)*0.04, verts: generateAsteroidVerts(size), craters: generateCraters(size), hp, maxHp: hp, hitFlash: 0, cracks: hp > 1 ? generateCracks(2 + size) : null });
}
// Craters are fixed per asteroid in unit space (angle, distance from centre,
// radius) so they tumble with the rock instead of swimming across it.
function generateCraters(size) {
  const n = 2 + size;
  const craters = [];
  for (let i = 0; i < n; i++) {
    craters.push({
      a: Math.random() * Math.PI * 2,
      d: 0.15 + Math.random() * 0.55,
      r: 0.10 + Math.random() * 0.16

  }
  return craters;
}
function generateAsteroidVerts(size) {
  const n = 7 + size;
  const verts = [];
  for (let i=0; i<n; i++) {
    const a = (i/n)*Math.PI*2;
    const r = 0.7 + Math.random()*0.4;
    verts.push({ a, r });
  }
  return verts;
}
function updateAsteroids() {
  for (const a of asteroids) {
    a.x += a.vx * dt; a.y += a.vy * dt;
    a.rot += a.rotSpeed * dt;
    if (a.hitFlash > 0) a.hitFlash -= dt;
    if (a.x < -a.radius) a.x = W + a.radius;
    if (a.x > W + a.radius) a.x = -a.radius;
    if (a.y < -a.radius) a.y = H + a.radius;
    if (a.y > H + a.radius) a.y = -a.radius;

}
// Rock, not neon: a radial gradient fakes sunlight from the upper-left, a dark
// outline separates it from the void, and per-asteroid craters add surface.
// Deliberately kept below the bloom threshold so asteroids never glow — being
// the one matte thing on screen is what makes them read as solid rock.
function drawAsteroids() {
  for (const a of asteroids) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);

    if (spriteReady(SPRITES.asteroid)) {
      // One master remains legible across the three gameplay sizes; its matte
      // pixels stay beneath the bloom threshold unlike the interactive neon.
      const size = a.radius * 2.45;
      ctx.drawImage(SPRITES.asteroid, -size / 2, -size / 2, size, size);
      drawArmor(a);
      ctx.restore();
      continue;
    }

    const lit = ctx.createRadialGradient(-a.radius*0.45, -a.radius*0.45, a.radius*0.1, 0, 0, a.radius*1.15);
    lit.addColorStop(0, '#585866');
    lit.addColorStop(0.55, '#38383F');
    lit.addColorStop(1, '#1B1B20');

    ctx.beginPath();
    a.verts.forEach((v,i) => {
      const x = Math.cos(v.a) * a.radius * v.r;
      const y = Math.sin(v.a) * a.radius * v.r;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle = lit;
    ctx.fill();
    ctx.strokeStyle = 'rgba(12,12,16,0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Craters: dark bowl plus a thin lit rim on the sun-facing side.
    for (const c of a.craters) {
      const cx = Math.cos(c.a) * c.d * a.radius;
      const cy = Math.sin(c.a) * c.d * a.radius;
      const cr = c.r * a.radius;
      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(14,14,20,0.55)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, cr, Math.PI*0.65, Math.PI*1.55);
      ctx.strokeStyle = 'rgba(170,170,185,0.30)';
      ctx.lineWidth = 1;

    ctx.restore();

// Armoured rocks read through their fissures, which is what the crack-energy

// shoot, blazing once the rock is nearly broken. The rock body itself stays
// matte — only the cracks glow, so asteroids keep their solid read.
function drawArmor(a) {
  if (a.maxHp <= 1) return;
  const dmg = 1 - a.hp / a.maxHp;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(0,255,204,${0.16 + dmg * 0.7})`;
  ctx.lineWidth = 1 + dmg * 1.4;
  ctx.lineCap = 'round';
  for (const c of a.cracks) {
    const r0 = c.r0 * a.radius, r1 = c.r1 * a.radius;
    const rm = (r0 + r1) * 0.5;
    ctx.beginPath();
    ctx.moveTo(Math.cos(c.a) * r0, Math.sin(c.a) * r0);
    ctx.lineTo(Math.cos(c.a + c.wob) * rm, Math.sin(c.a + c.wob) * rm);
    ctx.lineTo(Math.cos(c.a) * r1, Math.sin(c.a) * r1);
    ctx.stroke();
  }
  if (a.hitFlash > 0) {
    ctx.globalAlpha = Math.min(1, a.hitFlash / 6) * 0.5;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(0, 0, a.radius * 0.9, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
// Powerup drop roll, shared by split and vaporise. Weapon types split the
// remaining probability evenly so the three buffs stay equally common.
function maybeDropPowerup(x, y) {
  if (Math.random() >= (kidMode ? 0.22 : 0.12)) return;
  const roll = Math.random();
  const type = roll < 0.32 ? 'shield'
    : roll < 0.52 ? 'torpedo'
    : roll < 0.68 ? 'rapid'
    : roll < 0.84 ? 'spread'
    : 'pierce';
  powerups.push({ x, y, vx: (Math.random()-0.5)*1.5, vy: (Math.random()-0.5)*1.5, type, life: 400, radius: 12 });
}
function splitAsteroid(a, idx, playSound=true) {
  // Fireball, layered by temperature: fast white flash-sparks, a yellow core,
  // an orange body, slow lingering deep-red embers, and matte grey rock
  // shrapnel that doesn't bloom. Different speeds and lifetimes per layer are
  // what stop the burst reading as a single uniform puff.
  spawnParticles(a.x, a.y, 10 + a.size*5, '#FFFFFF', 7.5, 13, 2);
  spawnParticles(a.x, a.y, 22 + a.size*12, '#FFD23F', 5, 30, 3);
  spawnParticles(a.x, a.y, 20 + a.size*10, '#FF5E00', 3.4, 40, 3.2);
  spawnParticles(a.x, a.y, 8 + a.size*5, '#C22800', 2.0, 55, 3.6);
  spawnParticles(a.x, a.y, 8 + a.size*4, '#6A6A7A', 4.2, 34, 2.4);
  if (playSound) AudioFX.boom(a.size, a.x);
  shake = Math.max(shake, 8 + a.size*4);
  flash = 0.35;
  hitStop = Math.max(hitStop, 1 + a.size * 1.2);
  addScore(a.size * 50 * wave);
  if (a.size > 1) {
    for (let i=0; i<2; i++) spawnAsteroid(a.x, a.y, a.size-1, 1.3);
  }
  maybeDropPowerup(a.x, a.y);
  asteroids.splice(idx, 1);
}
// Single entry point for hurting a rock. Armoured rocks absorb the hit with a
// clank and a flash; unarmoured ones (and the last point of armour) split as
// before. Returns true if the rock was destroyed.
function damageAsteroid(a, idx, amount=1, playSound=true) {
  a.hp -= amount;
  if (a.hp > 0) {
    a.hitFlash = 6;
    spawnParticles(a.x, a.y, 5, '#00FFCC', 2.6, 16, 1.8);
    spawnParticles(a.x, a.y, 4, '#6A6A7A', 3, 20, 1.8);
    if (playSound) AudioFX.armorHit(a.x);
    shake = Math.max(shake, 2.5);
    addScore(15 * wave);   // chipping armour still pays, so it never feels inert
    return false;
  }
  splitAsteroid(a, idx, playSound);
  return true;
}
// Torpedo direct hit: the whole rock vaporises — no children — for roughly the
// value of clearing its full split chain. Bigger flash than a plain split.
function vaporizeAsteroid(a, idx) {
  spawnParticles(a.x, a.y, 16 + a.size*8, '#FFFFFF', 8.5, 14, 2.2);
  spawnParticles(a.x, a.y, 30 + a.size*14, '#FFD23F', 5.6, 34, 3.2);
  spawnParticles(a.x, a.y, 26 + a.size*12, '#FF5E00', 3.8, 46, 3.4);
  spawnParticles(a.x, a.y, 12 + a.size*6, '#C22800', 2.2, 60, 3.8);
  spawnParticles(a.x, a.y, 10 + a.size*5, '#6A6A7A', 4.6, 36, 2.4);
  addScore(a.size * 150 * wave);
  maybeDropPowerup(a.x, a.y);
  asteroids.splice(idx, 1);
}

const enemies = [];
function spawnEnemy() {
  const side = Math.floor(Math.random()*4);
  let x,y;
  if (side===0) { x=-30; y=Math.random()*H; }
  else if (side===1) { x=W+30; y=Math.random()*H; }
  else if (side===2) { x=Math.random()*W; y=-30; }
  else { x=Math.random()*W; y=H+30; }
  enemies.push({ x, y, vx:0, vy:0, angle: 0, radius: 16, fireCooldown: 120 + Math.random()*60, hp: 2, seed: Math.random()*Math.PI*2 });
}
function updateEnemies() {
  for (let i=enemies.length-1; i>=0; i--) {
    const e = enemies[i];
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx,dy) || 1;
    const desired = Math.atan2(dy,dx);
    let da = desired - e.angle;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    // Deliberately sluggish hunters: slow turn, gentle acceleration, long
    // refire and a shorter attack range, so they pressure rather than swarm.
    e.angle += da * 0.022 * dt;
    const accel = 0.05 * (kidMode ? 0.7 : 1);
    e.vx += Math.cos(e.angle) * accel * dt;
    e.vy += Math.sin(e.angle) * accel * dt;
    const eDrag = Math.pow(0.97, dt);
    e.vx *= eDrag; e.vy *= eDrag;
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.fireCooldown -= dt;
    if (e.fireCooldown <= 0 && dist < 360) {
      e.fireCooldown = kidMode ? 170 : 110;
      bullets.push({ x: e.x + Math.cos(e.angle)*14, y: e.y + Math.sin(e.angle)*14, vx: Math.cos(e.angle)*5.2, vy: Math.sin(e.angle)*5.2, life: 90, fromPlayer: false });
    }
    // spawnTrail already offsets backwards along the given angle; the old
    // +PI here was putting the exhaust in FRONT of the enemy.
    if (Math.random() < 0.25) spawnTrail(e.x, e.y, e.angle, '#FF00AA');
  }
}
// Rift Stalkers read as a different species from the player: curved manta
// silhouette against the player's hard angles, magenta against cyan, and a
// pulsing energy core instead of a cockpit.
function drawEnemies() {
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.angle);

    const pulse = 0.65 + 0.35 * Math.sin(frame * 0.18 + e.seed);

    if (spriteReady(SPRITES.riftStalker)) {
      // The generated ship faces right, matching the simulation's +X heading.
      // A slight pulse gives its magenta core life without baking another glow.
      const size = 48;
      ctx.globalAlpha = 0.9 + pulse * 0.1;
      ctx.drawImage(SPRITES.riftStalker, -size / 2, -size / 2, size, size);
      ctx.restore();
      continue;
    }

    // Manta hull: swept-back curved wings with a rear notch.
    const hull = ctx.createLinearGradient(0, -12, 0, 12);
    hull.addColorStop(0, '#2A1030');
    hull.addColorStop(0.5, '#160A1C');
    hull.addColorStop(1, '#0C0512');
    ctx.beginPath();
    ctx.moveTo(11, 0);
    ctx.quadraticCurveTo(2, -13, -12, -10);
    ctx.quadraticCurveTo(-5, -4, -8, 0);
    ctx.quadraticCurveTo(-5, 4, -12, 10);
    ctx.quadraticCurveTo(2, 13, 11, 0);
    ctx.closePath();
    ctx.fillStyle = hull;
    ctx.fill();
    ctx.strokeStyle = '#FF00AA';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Wingtip barbs
    for (const s of [1, -1]) {
      ctx.beginPath();
      ctx.arc(-11, 9.5*s, 1.3, 0, Math.PI*2);
      ctx.fillStyle = '#FF00AA';
      ctx.fill();
    }

    // Pulsing rift core
    const core = ctx.createRadialGradient(0, 0, 0.5, 0, 0, 6.5*pulse);
    core.addColorStop(0, '#FFE0F4');
    core.addColorStop(0.35, '#FF00AA');
    core.addColorStop(1, 'rgba(255,0,170,0)');
    ctx.beginPath();
    ctx.arc(0, 0, 6.5*pulse, 0, Math.PI*2);
    ctx.fillStyle = core;
    ctx.fill();

    ctx.restore();
  }
}

const powerups = [];
function updatePowerups() {
  for (let i=powerups.length-1; i>=0; i--) {
    const p = powerups[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.spin) p.rot += p.spin * dt;
    p.life -= dt;
    if (p.life <= 0) { powerups.splice(i,1); continue; }
    if (kidMode) {
      const dx = player.x - p.x, dy = player.y - p.y;
      const d = Math.hypot(dx,dy);
      if (d < 120) {
        p.vx += dx/d * 0.08 * dt;
        p.vy += dy/d * 0.08 * dt;
      }
    }
  }
}
function drawPowerups() {
  for (const p of powerups) {
    ctx.save();
    ctx.translate(p.x, p.y);

    // Lost starfighter: the player's own ship, adrift and spinning, with a
    // pulsing distress ring. Collecting it is +1 ship.
    if (p.type === 'starfighter') {
      const pulse = 0.5 + 0.5 * Math.sin(frame * 0.12);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.arc(0, 0, 20 + pulse * 5, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(0,245,255,${0.25 + pulse * 0.4})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
      ctx.rotate(p.rot);
      if (spriteReady(SPRITES.player)) {
        ctx.drawImage(SPRITES.player, -20, -20, 40, 40);
      } else {
        ctx.strokeStyle = '#00F5FF';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(13, 0); ctx.lineTo(-8, -8); ctx.lineTo(-4, 0); ctx.lineTo(-8, 8);
        ctx.closePath(); ctx.stroke();
      }
      ctx.restore();
      continue;
    }

    // Score multiplier: spinning gold four-point star with an × at the core.
    if (p.type === 'mult') {
      ctx.rotate(p.rot);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = '#FFD23F';
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const r = i % 2 === 0 ? 13 : 5;
        const a = (i / 8) * Math.PI * 2;
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.rotate(-p.rot);
      ctx.fillStyle = '#05010A';
      ctx.font = '700 11px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('×', 0, 1);
      ctx.restore();
      continue;
    }

    const sprite = p.type === 'shield' ? SPRITES.shieldPickup : p.type === 'rapid' ? SPRITES.rapidPickup : p.type === 'torpedo' ? SPRITES.torpedo : null;
    if (sprite && spriteReady(sprite)) {
      const size = p.type === 'torpedo' ? 42 : 52;
      ctx.drawImage(sprite, -size / 2, -size / 2, size, size);
      ctx.restore();
      continue;
    }

    // SPREAD and PIERCE have no sprite yet: glowing ring plus a readable glyph
    // in the weapon's bullet colour.
    if (p.type === 'spread' || p.type === 'pierce') {
      const col = p.type === 'spread' ? '#00F5FF' : '#3A7BFF';
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI*2);
      ctx.stroke();
      if (p.type === 'spread') {
        // three bolts fanning out from the base of the ring
        for (const off of [-0.5, 0, 0.5]) {
          ctx.beginPath();
          ctx.moveTo(Math.cos(-Math.PI/2 + off) * 2, Math.sin(-Math.PI/2 + off) * 2 + 6);
          ctx.lineTo(Math.cos(-Math.PI/2 + off) * 9, Math.sin(-Math.PI/2 + off) * 9 + 2);
          ctx.stroke();
        }
      } else {
        // an arrow drilling straight through two target dots
        ctx.beginPath();
        ctx.moveTo(-8, 0); ctx.lineTo(8, 0);
        ctx.moveTo(4, -3); ctx.lineTo(8, 0); ctx.lineTo(4, 3);
        ctx.stroke();
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(-3, 0, 1.6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(2, 0, 1.6, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
      ctx.restore();
      continue;
    }

    ctx.fillStyle = p.type === 'shield' ? '#3A7BFF' : p.type === 'rapid' ? '#00F5FF' : '#FF8A24';
    if (p.type === 'torpedo') {
      ctx.fillRect(-11,-4,18,8);
      ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(6,-5); ctx.lineTo(6,5); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// ---- Random specials: score multipliers and the lost starfighter ----
// Both drift in from a random edge on their own randomised timers, cross the
// field, and expire if not collected. Timers pause during wave transitions.
let multSpawnT = 0, sfSpawnT = 0;
function resetSpecialTimers() {
  multSpawnT = 600 + Math.random() * 600;     // 10–20s
  sfSpawnT = 4800 + Math.random() * 3600;     // 80–140s — halved rate, it is a rare rescue
}
function spawnSpecial(type) {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = -20; y = Math.random() * H; }
  else if (side === 1) { x = W + 20; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = -20; }
  else { x = Math.random() * W; y = H + 20; }
  // Aim loosely at a point in the middle half of the field so it always
  // crosses somewhere reachable.
  const tx = W * (0.25 + Math.random() * 0.5), ty = H * (0.25 + Math.random() * 0.5);
  const a = Math.atan2(ty - y, tx - x);
  const speed = 0.8 + Math.random() * 0.6;
  powerups.push({
    x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, type,
    life: type === 'mult' ? 480 : 640,
    radius: type === 'mult' ? 13 : 16,
    rot: 0,
    spin: (Math.random() < 0.5 ? -1 : 1) * (0.05 + Math.random() * 0.04)
  });
}
function updateSpecialSpawns() {
  if (waveTransition) return;
  multSpawnT -= dt;
  if (multSpawnT <= 0) { spawnSpecial('mult'); multSpawnT = 600 + Math.random() * 700; }
  sfSpawnT -= dt;
  if (sfSpawnT <= 0) {
    // Do not float another rescue past the life cap — reroll the timer instead.
    if (lives < MAX_LIVES) spawnSpecial('starfighter');
    sfSpawnT = 5200 + Math.random() * 4800;
  }
}

function checkCollisions() {
  for (let ti=torpedoShots.length-1; ti>=0; ti--) {
    const t = torpedoShots[ti];
    let hit = false;
    for (let ai=asteroids.length-1; ai>=0; ai--) {
      const a = asteroids[ai];
      if (Math.hypot(t.x-a.x, t.y-a.y) < a.radius + t.radius) {
        const x = t.x, y = t.y;
        vaporizeAsteroid(a, ai);
        // Blast wave: rocks near the detonation take a bullet-grade hit. The
        // torpedo boom is the sound; extra per-rock booms would just be mud.
        // Children pushed during a split land past the countdown start index,
        // so the wave can never chain into fragments it just created.
        for (let ni=asteroids.length-1; ni>=0; ni--) {
          const n = asteroids[ni];
          if (Math.hypot(x-n.x, y-n.y) < 110 + n.radius) damageAsteroid(n, ni, 2, false);
        }
        detonateTorpedo(ti, x, y);
        hit = true;
        break;
      }
    }
    if (hit) continue;
    for (let ei=enemies.length-1; ei>=0; ei--) {
      const e = enemies[ei];
      if (Math.hypot(t.x-e.x, t.y-e.y) < e.radius + t.radius) {
        spawnParticles(e.x, e.y, 50, '#FF00AA', 6, 42, 3.2);
        addScore(250 * wave);
        enemies.splice(ei,1);
        detonateTorpedo(ti, t.x, t.y);
        break;
      }
    }
  }
  // PIERCE stacks let a bullet survive hits: each impact still splits the rock
  // but only decrements the pierce budget until it runs out.
  for (let bi=bullets.length-1; bi>=0; bi--) {
    const b = bullets[bi];
    if (!b.fromPlayer) continue;
    for (let ai=asteroids.length-1; ai>=0; ai--) {
      const a = asteroids[ai];
      if (Math.hypot(b.x-a.x, b.y-a.y) < a.radius + 4) {
        if (b.pierce > 0) b.pierce--; else bullets.splice(bi,1);
        damageAsteroid(a, ai);
        break;
      }
    }
  }
  for (let bi=bullets.length-1; bi>=0; bi--) {
    const b = bullets[bi];
    if (!b.fromPlayer) continue;
    for (let ei=enemies.length-1; ei>=0; ei--) {
      const e = enemies[ei];
      if (Math.hypot(b.x-e.x, b.y-e.y) < e.radius + 4) {
        if (b.pierce > 0) b.pierce--; else bullets.splice(bi,1);
        e.hp--;
        spawnParticles(e.x, e.y, 8, '#FF00AA', 3, 20, 2);
        if (e.hp <= 0) {
          spawnParticles(e.x, e.y, 55, '#FF00AA', 6, 44, 3.2);
          spawnParticles(e.x, e.y, 24, '#FF5E00', 4, 32, 2.4);
          spawnParticles(e.x, e.y, 14, '#FFFFFF', 8, 15, 2);
          AudioFX.enemyBoom(e.x);
          addScore(250 * wave);
          shake = Math.max(shake, 14);
          flash = 0.4;
          hitStop = Math.max(hitStop, 4);
          enemies.splice(ei,1);
        }
        break;
      }
    }
  }
  if (player.invuln > 0) return;
  const shielding = (shieldActive() || kidMode) && player.shield > 5;
  // Shield-ramming an asteroid destroys it (full split, scores normally) at a
  // fixed shield cost. One per frame: splitAsteroid mutates the array, so we
  // handle the first hit and break rather than keep iterating stale indices.
  for (let ai = asteroids.length - 1; ai >= 0; ai--) {
    const a = asteroids[ai];
    if (Math.hypot(player.x-a.x, player.y-a.y) < a.radius + player.radius) {
      if (shielding) {
        player.shield = Math.max(0, player.shield - (8 + a.size * 5));
        spawnParticles(player.x, player.y, 15, '#3A7BFF', 4, 25, 3);
        AudioFX.shieldHit();
        splitAsteroid(a, ai);
        break;
      } else {
        playerHit();
        return;
      }
    }
  }
  for (const e of enemies) {
    if (Math.hypot(player.x-e.x, player.y-e.y) < e.radius + player.radius) {
      if (shielding) {
        player.shield = Math.max(0, player.shield - 40);
        spawnParticles(player.x, player.y, 20, '#3A7BFF', 5, 30, 3);
        AudioFX.shieldHit();
      } else {
        playerHit();
        return;
      }
    }
  }
  for (let bi=bullets.length-1; bi>=0; bi--) {
    const b = bullets[bi];
    if (b.fromPlayer) continue;
    if (Math.hypot(player.x-b.x, player.y-b.y) < player.radius + 5) {
      bullets.splice(bi,1);
      if (shielding) {
        player.shield = Math.max(0, player.shield - 15);
        spawnParticles(player.x, player.y, 8, '#3A7BFF', 3, 20, 2);
        AudioFX.shieldHit();
      } else {
        playerHit();
        return;
      }
    }
  }
  for (let i=powerups.length-1; i>=0; i--) {
    const p = powerups[i];
    if (Math.hypot(player.x-p.x, player.y-p.y) < player.radius + p.radius) {
      let pickupColor = '#00F5FF';
      if (p.type === 'shield') {
        player.shield = Math.min(player.maxShield, player.shield + 50);
        pickupColor = '#3A7BFF';
        AudioFX.pickup();
      } else if (p.type === 'torpedo') {
        player.torpedoes = Math.min(9, player.torpedoes + 2);
        pickupColor = '#FF8A24';
        AudioFX.pickup();
      } else if (p.type === 'mult') {
        scoreMult = Math.min(MULT_MAX, scoreMult + 1);
        multTimer = MULT_DURATION;
        pickupColor = '#FFD23F';
        addToast('SCORE ×' + scoreMult, '#FFD23F');
        AudioFX.multiplierPickup();
      } else if (p.type === 'starfighter') {
        if (lives < MAX_LIVES) {
          lives++;
          addToast('STARFIGHTER RESCUED  +1 SHIP', '#00F5FF');
          AudioFX.extraLife();
        } else {
          // At the cap the rescue still pays — as points, not a tenth ship.
          addToast('STARFIGHTER RESCUED  +5,000', '#00F5FF');
          addScore(5000);
          AudioFX.multiplierPickup();
        }
      } else {
        // Weapon buffs stack to ×3 and persist until the ship is lost.
        const w = player.weapons;
        w[p.type] = Math.min(MAX_WEAPON_STACK, w[p.type] + 1);
        addToast(p.type.toUpperCase() + ' ×' + w[p.type], p.type === 'pierce' ? '#3A7BFF' : '#00F5FF');
        AudioFX.pickup();
      }
      spawnParticles(p.x, p.y, 12, pickupColor, 3, 25, 2);
      powerups.splice(i,1);
      addScore(100);
    }
  }
}
function playerHit() {
  lives--;
  spawnParticles(player.x, player.y, 30, '#FFFFFF', 9, 18, 2.5);
  spawnParticles(player.x, player.y, 60, '#FFD23F', 7, 45, 3.6);
  spawnParticles(player.x, player.y, 55, '#FF5E00', 5, 50, 3.4);
  spawnParticles(player.x, player.y, 25, '#C22800', 2.5, 65, 4);
  spawnParticles(player.x, player.y, 20, '#00F5FF', 6, 40, 2.5); // ship debris sparks
  shake = 25;
  flash = 0.7;
  hitStop = 8;
  if (lives <= 0) {
    // Final death gets the game-over sting (played in endGame), not the
    // ordinary death boom — the two must not stack.
    endGame();
  } else {
    AudioFX.playerBoom();
    resetPlayer();
  }
}

// Every pending spawn timer, so a restart or a quit to menu can cancel them.
// Without this, enemies queued by the previous run keep arriving after you die,
// on the menu, and into the next game.
const pendingTimers = new Set();
function later(fn, ms) {
  const id = setTimeout(() => { pendingTimers.delete(id); fn(); }, ms);
  pendingTimers.add(id);
  return id;
}
function clearPendingTimers() {
  for (const id of pendingTimers) clearTimeout(id);
  pendingTimers.clear();
}

// True while the next wave is queued but has not spawned yet.
let waveTransition = false;

// ---- End-of-wave points tally ----
// A short breather between waves where the wave bonus counts up into the
// score, drawn on the game canvas so it glows. The ship stays flyable — this
// is an overlay moment, not a modal.
let tally = null;
const tallyEl = document.getElementById('waveTally');
const wtTitle = document.getElementById('wtTitle');
const wtBonus = document.getElementById('wtBonus');
let shownBonus = null;
// Presentation lives in the DOM (see #waveTally in the stylesheet) so the
// counters stay readable; only the text content changes as the count runs.
function renderTally() {
  const show = !!tally && tally.timer < 190;
  tallyEl.classList.toggle('show', show);
  if (!tally) { shownBonus = null; return; }
  if (shownBonus !== tally.awarded) {
    shownBonus = tally.awarded;
    wtTitle.textContent = 'WAVE ' + tally.wave + ' CLEAR';
    wtBonus.textContent = 'BONUS +' + tally.awarded.toLocaleString();
  }
}
function hideTally() {
  tally = null; shownBonus = null;
  tallyEl.classList.remove('show');
}
function updateTally() {
  if (!tally) return;
  tally.timer += dt;
  // Counting runs from tick 30 to 100 (~0.5s–1.7s into the transition).
  const portion = Math.min(1, Math.max(0, (tally.timer - 30) / 70));
  const target = Math.floor(tally.bonus * portion);
  if (target > tally.counted) {
    tally.awarded += addScore(target - tally.counted);
    tally.counted = target;
    tally.tickCd -= dt;
    if (tally.tickCd <= 0) { AudioFX.tick(); tally.tickCd = 4; }
  }
}
function startWave() {
  waveTransition = false;
  hideTally();
  // Count plateaus at 14 large rocks (reached around wave 6); past that,
  // difficulty comes from armourFor() hardening them instead. Unbounded growth
  // was the direct cause of the late-wave stutter measured on 2026-08-07.
  const count = Math.min(3 + wave * 2, 14);
  for (let i=0; i<count; i++) {
    let x,y,tries = 0;
    do {
      x = Math.random()*W; y = Math.random()*H;
      tries++;
    } while (Math.hypot(x-CX, y-CY) < 180 && tries < 50);
    spawnAsteroid(x, y, 3);
  }
  // Rift Stalkers arrive from wave 3, one at first, capped at 3, spaced well
  // apart — pressure, not a swarm.
  if (wave > 2) {
    const ec = Math.min(1 + Math.floor((wave - 3) / 2), 3);
    for (let i=0; i<ec; i++) later(spawnEnemy, 1200 + i*1500);
  }
}
function checkWaveClear() {
  // The guard is essential. This runs every frame, but the next wave is on a
  // 1500ms timer, so without it the field-is-empty condition stays true for
  // ~90 frames at 60Hz: wave incremented 90 times and 90 spawns were queued,
  // turning a cleared wave 1 into wave 91 and 450 enemies arriving at once.
  if (waveTransition) return;
  if (asteroids.length === 0 && enemies.length === 0 && state === State.PLAY) {
    waveTransition = true;
    // Tally the cleared wave, then advance. The longer 3400ms gap is the
    // points-counting phase; startWave clears the tally when the next set
    // arrives.
    tally = { wave, bonus: 250 * wave, counted: 0, awarded: 0, timer: 0, tickCd: 0 };
    wave++;
    later(startWave, 3400);
  }
}

function startGame() {
  clearPendingTimers();
  waveTransition = false;
  hitStop = 0; shake = 0; flash = 0;
  score = 0; lives = 3; wave = 1;
  scoreMult = 1; multTimer = 0;
  lifeStep = LIFE_FIRST; nextLifeScore = LIFE_FIRST;
  hideTally(); clearToasts();
  resetSpecialTimers();
  asteroids.length = 0; enemies.length = 0; bullets.length = 0;
  torpedoShots.length = 0; powerups.length = 0; particles.length = 0;
  player.torpedoes = 3;
  resetPlayer();
  startWave();
  state = State.PLAY;
  AudioFX.restartMusic();
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('pause').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
}
function endGame() {
  clearPendingTimers();
  waveTransition = false;
  // renderTally only runs in the PLAY/PAUSE branch, so dying mid-count would
  // otherwise leave the tally frozen on top of the game-over screen.
  hideTally();
  clearToasts();
  state = State.GAMEOVER;
  AudioFX.setMusic(false);
  AudioFX.gameOver();
  document.getElementById('finalScore').textContent = score.toLocaleString();
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('gameover').classList.remove('hidden');
  // Name entry only when the run actually places on the board.
  const qualifies = score > 0 && (highScores.length < 10 || score > highScores[highScores.length - 1].score);
  document.getElementById('nameEntry').classList.toggle('hidden', !qualifies);
  document.getElementById('goHint').textContent = qualifies ? 'NEW HIGH SCORE — ENTER YOUR NAME' : '';
  if (qualifies) {
    const inp = document.getElementById('nameInput');
    inp.value = localStorage.getItem('vc_name') || '';
    setTimeout(() => inp.focus(), 60);
  }
}
function saveScore() {
  const entry = document.getElementById('nameEntry');
  if (entry.classList.contains('hidden')) return;   // guard against double-submit
  const name = (document.getElementById('nameInput').value.trim() || 'PILOT').toUpperCase().slice(0, 12);
  localStorage.setItem('vc_name', name);
  highScores.push({ name, score });
  highScores.sort((a, b) => b.score - a.score);
  highScores = highScores.slice(0, 10);
  localStorage.setItem('vc_scores', JSON.stringify(highScores));
  entry.classList.add('hidden');
  document.getElementById('goHint').textContent = 'SCORE SAVED';
  renderMenuScores();
}
function showMenu() {
  clearPendingTimers();
  waveTransition = false;
  hideTally();
  clearToasts();
  rebinding = null;
  renderMenuScores();
  state = State.MENU;
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('pause').classList.add('hidden');
  document.getElementById('scores').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
}

document.getElementById('btnPlay').onclick = () => {
  kidMode = document.getElementById('kidMode').checked;
  startGame();
};
document.getElementById('btnScores').onclick = () => {
  const list = document.getElementById('hsList');
  list.innerHTML = highScores.length ? highScores.map(hsRow).join('') : '<div class="hs-row">No scores yet</div>';
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('scores').classList.remove('hidden');
  state = State.SCORES;
};
document.getElementById('btnControls').onclick = () => {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('controls').classList.remove('hidden');
  state = State.CONTROLS;
};
document.getElementById('btnBackScores').onclick = showMenu;
document.getElementById('btnBackControls').onclick = showMenu;
document.getElementById('btnResume').onclick = () => {
  state = State.PLAY;
  document.getElementById('pause').classList.add('hidden');
};
document.getElementById('btnQuit').onclick = showMenu;
document.getElementById('btnRetry').onclick = startGame;
document.getElementById('btnMenu').onclick = showMenu;
document.getElementById('btnSaveScore').onclick = saveScore;
document.getElementById('nameInput').addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') saveScore();
});

// B toggles the whole post chain on and off mid-frame, so the effect can be
// judged by flipping it during play rather than by comparing screenshots.
const fxLabel = document.getElementById('fxLabel');
let fxLabelTimer = 0;
function flashFxLabel(text) {
  fxLabel.textContent = text;
  fxLabel.style.opacity = '1';
  clearTimeout(fxLabelTimer);
  fxLabelTimer = setTimeout(() => { fxLabel.style.opacity = '0'; }, 1100);
}
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.code === 'KeyB') {
    BLOOM.enabled = !BLOOM.enabled;
    flashFxLabel('BLOOM ' + (BLOOM.enabled ? 'ON' : 'OFF'));
  }
  if (e.code === 'KeyM') {
    flashFxLabel('SOUND ' + (AudioFX.toggleMute() ? 'OFF' : 'ON'));
  }
});

window.addEventListener('keydown', e => {
  if (binds.pause.includes(e.code)) {
    if (state === State.PLAY) {
      state = State.PAUSE;
      document.getElementById('pause').classList.remove('hidden');
    } else if (state === State.PAUSE) {
      state = State.PLAY;
      document.getElementById('pause').classList.add('hidden');
    }
  }
});

// ---- Controls screen: rebindable keys ----
const KEY_LABELS = { Space:'SPACE', Backspace:'BKSP', ShiftLeft:'SHIFT', ShiftRight:'R-SHIFT', Escape:'ESC', ControlLeft:'CTRL', ControlRight:'R-CTRL', AltLeft:'ALT', Tab:'TAB', Enter:'ENTER', ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT' };
function keyLabel(code) {
  return KEY_LABELS[code] || code.replace(/^(Key|Digit|Numpad)/, '').toUpperCase();
}
function renderBinds() {
  const list = document.getElementById('bindList');
  list.innerHTML = ACTIONS.map(([a, label]) =>
    `<div class="bind-row"><span class="bind-name">${label}</span><span>` +
    binds[a].map((c, i) => {
      const active = rebinding && rebinding.action === a && rebinding.slot === i;
      return `<button class="bindkey${active ? ' listening' : ''}" data-a="${a}" data-i="${i}">${active ? 'PRESS…' : keyLabel(c)}</button>`;
    }).join('') + `</span></div>`
  ).join('');
  list.querySelectorAll('.bindkey').forEach(btn => {
    btn.onclick = () => {
      rebinding = { action: btn.dataset.a, slot: +btn.dataset.i };
      renderBinds();
    };
  });
}
document.getElementById('btnResetBinds').onclick = () => {
  for (const [a] of ACTIONS) binds[a] = [...DEFAULT_BINDS[a]];
  saveBinds();
  rebinding = null;
  renderBinds();
};

// ---- Home screen leaderboard ----
// Names are user text going into innerHTML — escape them.
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hsRow(e, i) {
  return `<div class="hs-row"><span>#${i+1} ${esc(e.name)}</span><span>${e.score.toLocaleString()}</span></div>`;
}
function renderMenuScores() {
  const el = document.getElementById('menuScores');
  el.innerHTML = highScores.length
    ? highScores.slice(0, 5).map(hsRow).join('')
    : '<div class="hs-row"><span>NO SCORES YET</span><span>—</span></div>';
}
renderMenuScores();
renderBinds();

function loop(now) {
  requestAnimationFrame(loop);

  // Normalise elapsed time to 60Hz ticks. The clamp stops a backgrounded tab
  // from resuming with one enormous step that tunnels collisions.
  if (!lastTime) lastTime = now || 0;
  const elapsed = (now || 0) - lastTime;
  lastTime = now || 0;
  dt = Math.min(elapsed / 16.6667, 3) || 1;

  frame += dt;
  pollGamepad();
  AudioFX.setMusic(state !== State.GAMEOVER);
  AudioFX.ensureMusic();
  if (AudioFX.isRunning() && audioHintEl.style.display !== 'none') {
    audioHintEl.style.display = 'none';
  }
  AudioFX.setThrust(state === State.PLAY && player.thrust,
    Math.min(1, Math.hypot(player.vx, player.vy) / 7.5));

  // Hit-stop: keep rendering, suspend simulation. Reads as impact weight.
  const frozen = hitStop > 0;
  if (frozen) hitStop -= dt;

  drawBackground();
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    shake *= Math.pow(0.88, dt);
    if (shake < 0.1) shake = 0;
  }
  if (state === State.PLAY || state === State.PAUSE) {
    if (state === State.PLAY && !frozen) {
      updatePlayer();
      updateBullets();
      updateTorpedoes();
      updateAsteroids();
      updateEnemies();
      updatePowerups();
      updateSpecialSpawns();
      updateParticles();
      updateTally();
      checkCollisions();
      checkWaveClear();
    }
    drawAsteroids();
    drawEnemies();
    drawPowerups();
    drawBullets();
    drawTorpedoes();
    drawPlayer();
    drawParticles();
    renderTally();
    document.getElementById('hudScore').textContent = score.toLocaleString();
    document.getElementById('hudWave').textContent = `WAVE ${wave}`;
    renderLives();
    renderTorpedoes();
    renderWeapons();
    renderMult();
    document.getElementById('shieldFill').style.width = (player.shield / player.maxShield * 100) + '%';
  } else {
    updateParticles();
    drawParticles();
  }
  ctx.restore();

  if (flash > 0) {
    flash *= Math.pow(0.85, dt);
    if (flash < 0.005) flash = 0;
  }

  // Everything drawn above lands in the offscreen canvas. This is the step
  // that actually turns it into the look: bright pass, two blur octaves,
  // additive composite, chromatic aberration, vignette.
  postfx.render({
    bloomIntensity: BLOOM.enabled ? BLOOM.intensity : 0,
    threshold: BLOOM.threshold,
    knee: BLOOM.knee,
    radius: BLOOM.radius,
    aberration: BLOOM.aberration + shake * 0.0012,
    vignette: BLOOM.vignette,
    kneeStart: BLOOM.kneeStart,
    flash: flash * 0.85
  });
}
requestAnimationFrame(loop);

for (let i=0; i<30; i++) {
  spawnParticles(Math.random()*W, Math.random()*H, 1, '#00F5FF', 0.3, 200, 1.5);
}
</script>
