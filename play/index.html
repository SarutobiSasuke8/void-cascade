<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VOID CASCADE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05010A;
    overflow: hidden;
    font-family: 'Orbitron', system-ui, sans-serif;
    color: #00F5FF;
    user-select: none;
    -webkit-user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #05010A;
    box-shadow: 0 0 80px rgba(0, 245, 255, 0.15);
  }
  #ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(26,10,46,0.85) 0%, rgba(5,1,10,0.95) 70%);
    pointer-events: auto;
    transition: opacity 0.4s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .logo {
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    background: linear-gradient(90deg, #00F5FF, #FF00AA, #00F5FF);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s linear infinite;
    text-shadow: 0 0 40px rgba(0,245,255,0.5);
    margin-bottom: 0.3em;
  }
  @keyframes shimmer {
    to { background-position: 200% center; }
  }
  .tagline {
    font-size: 0.9rem;
    letter-spacing: 0.4em;
    color: #3A7BFF;
    margin-bottom: 3rem;
    opacity: 0.8;
  }
  .btn {
    pointer-events: auto;
    background: transparent;
    border: 2px solid #00F5FF;
    color: #00F5FF;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 0.9rem 2.8rem;
    margin: 0.6rem;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn:hover, .btn:focus {
    background: rgba(0,245,255,0.15);
    box-shadow: 0 0 30px rgba(0,245,255,0.4);
    transform: scale(1.05);
  }
  .btn.secondary {
    border-color: #3A7BFF;
    color: #3A7BFF;
    font-size: 0.85rem;
    padding: 0.6rem 1.8rem;
  }
  .btn.secondary:hover {
    background: rgba(58,123,255,0.15);
    box-shadow: 0 0 20px rgba(58,123,255,0.3);
  }
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 1.2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    font-size: 0.95rem;
    letter-spacing: 0.1em;
  }
  .hud-left, .hud-right { display: flex; flex-direction: column; gap: 0.3rem; }
  .score { font-size: 1.6rem; font-weight: 700; color: #00F5FF; text-shadow: 0 0 12px #00F5FF; }
  .lives { color: #FF00AA; }
  .wave { color: #3A7BFF; }
  .shield-bar {
    width: 120px; height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }
  .shield-fill {
    height: 100%;
    background: linear-gradient(90deg, #3A7BFF, #00F5FF);
    width: 0%;
    transition: width 0.15s;
  }
  #pauseHint {
    position: absolute;
    bottom: 1.5rem;
    font-size: 0.7rem;
    opacity: 0.4;
    letter-spacing: 0.15em;
  }
  .highscores {
    max-height: 40vh;
    overflow-y: auto;
    margin: 1.5rem 0;
    width: min(90vw, 360px);
  }
  .hs-row {
    display: flex;
    justify-content: space-between;
    padding: 0.4rem 1rem;
    border-bottom: 1px solid rgba(0,245,255,0.15);
    font-size: 0.9rem;
  }
  .hs-row:nth-child(1) { color: #00F5FF; font-weight: 700; }
  .kid-toggle {
    margin-top: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 0.85rem;
    color: #3A7BFF;
  }
  .kid-toggle input { accent-color: #00F5FF; width: 18px; height: 18px; }
  #flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="c"></canvas>
  <div id="flash"></div>
  <div id="ui">
    <div id="menu" class="screen">
      <div class="logo">VOID CASCADE</div>
      <div class="tagline">SHATTER THE VOID</div>
      <button class="btn" id="btnPlay">PLAY</button>
      <button class="btn secondary" id="btnScores">HIGH SCORES</button>
      <button class="btn secondary" id="btnControls">CONTROLS</button>
      <div class="kid-toggle">
        <input type="checkbox" id="kidMode">
        <label for="kidMode">KID MODE (easier)</label>
      </div>
      <div id="pauseHint">ESC / START to pause • Gamepad supported</div>
    </div>
    <div id="scores" class="screen hidden">
      <div class="logo" style="font-size:2.5rem">HIGH SCORES</div>
      <div class="highscores" id="hsList"></div>
      <button class="btn secondary" id="btnBackScores">BACK</button>
    </div>
    <div id="controls" class="screen hidden">
      <div class="logo" style="font-size:2.2rem">CONTROLS</div>
      <div style="text-align:left; line-height:1.8; margin:1.5rem 0; font-size:0.9rem; color:#aaa;">
        <div>← → / A D &nbsp;&nbsp; Rotate</div>
        <div>↑ / W &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Thrust</div>
        <div>SPACE / Z &nbsp;&nbsp;&nbsp; Fire</div>
        <div>SHIFT &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Shield (when available)</div>
        <div>ESC / P &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Pause</div>
        <div style="margin-top:1rem; color:#00F5FF">Gamepad fully supported</div>
      </div>
      <button class="btn secondary" id="btnBackControls">BACK</button>
    </div>
    <div id="pause" class="screen hidden">
      <div class="logo" style="font-size:3rem">PAUSED</div>
      <button class="btn" id="btnResume">RESUME</button>
      <button class="btn secondary" id="btnQuit">QUIT TO MENU</button>
    </div>
    <div id="gameover" class="screen hidden">
      <div class="logo" style="font-size:2.8rem">CASCADE COMPLETE</div>
      <div class="score" id="finalScore" style="margin:1rem 0 2rem">0</div>
      <button class="btn" id="btnRetry">TRY AGAIN</button>
      <button class="btn secondary" id="btnMenu">MAIN MENU</button>
    </div>
    <div class="hud hidden" id="hud">
      <div class="hud-left">
        <div class="score" id="hudScore">0</div>
        <div class="wave" id="hudWave">WAVE 1</div>
      </div>
      <div class="hud-right">
        <div class="lives" id="hudLives">▲ ▲ ▲</div>
        <div class="shield-bar"><div class="shield-fill" id="shieldFill"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
// VOID CASCADE — Browser Prototype
// Full modern particle-hybrid Asteroids remake
// (core gameplay + visual juice preserved from design)
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const flashEl = document.getElementById('flash');
let W, H, CX, CY;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2; CY = H / 2;
}
window.addEventListener('resize', resize);
resize();

const State = { MENU:0, PLAY:1, PAUSE:2, GAMEOVER:3, SCORES:4, CONTROLS:5 };
let state = State.MENU;
let kidMode = false;
let score = 0, lives = 3, wave = 1, highScores = JSON.parse(localStorage.getItem('vc_scores') || '[]');
let shake = 0, flash = 0;
let frame = 0;

const keys = {};
const gamepad = { axes: [0,0], buttons: {} };
window.addEventListener('keydown', e => { keys[e.code] = true; if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
window.addEventListener('keyup', e => keys[e.code] = false);

function pollGamepad() {
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = gps[0];
  if (!gp) return;
  gamepad.axes[0] = Math.abs(gp.axes[0]) > 0.2 ? gp.axes[0] : 0;
  gamepad.axes[1] = Math.abs(gp.axes[1]) > 0.2 ? gp.axes[1] : 0;
  gamepad.buttons = {};
  gp.buttons.forEach((b,i) => gamepad.buttons[i] = b.pressed);
}

const particles = [];
function spawnParticles(x, y, count, color, speed=3, life=40, size=3) {
  for (let i=0; i<count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.4 + Math.random()*0.8);
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: life * (0.6 + Math.random()*0.5), maxLife: life, size: size * (0.5 + Math.random()), color, glow: true });
  }
}
function spawnTrail(x, y, angle, color) {
  particles.push({ x: x - Math.cos(angle)*12, y: y - Math.sin(angle)*12, vx: (Math.random()-0.5)*0.8, vy: (Math.random()-0.5)*0.8, life: 18 + Math.random()*10, maxLife: 25, size: 2.5 + Math.random()*2, color, glow: true });
}
function updateParticles() {
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.98; p.vy *= 0.98;
    p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }
}
function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha * 0.9;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2);
    ctx.fill();
    if (p.glow) {
      ctx.globalAlpha = alpha * 0.25;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 3 * alpha, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

const stars = [];
for (let i=0; i<180; i++) {
  stars.push({ x: Math.random(), y: Math.random(), z: Math.random()*3 + 0.3, size: Math.random()*1.6 + 0.3 });
}
const nebulaBlobs = [];
for (let i=0; i<8; i++) {
  nebulaBlobs.push({ x: Math.random()*W, y: Math.random()*H, r: 120 + Math.random()*200, vx: (Math.random()-0.5)*0.15, vy: (Math.random()-0.5)*0.15, hue: 260 + Math.random()*40 });
}
function drawBackground() {
  ctx.fillStyle = '#05010A';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const n of nebulaBlobs) {
    n.x += n.vx; n.y += n.vy;
    if (n.x < -n.r) n.x = W+n.r;
    if (n.x > W+n.r) n.x = -n.r;
    if (n.y < -n.r) n.y = H+n.r;
    if (n.y > H+n.r) n.y = -n.r;
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, `hsla(${n.hue},70%,40%,0.12)`);
    g.addColorStop(0.5, `hsla(${n.hue},60%,25%,0.05)`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
  for (const s of stars) {
    const px = (s.x * W + frame * 0.02 * s.z) % W;
    const py = (s.y * H + frame * 0.01 * s.z) % H;
    ctx.globalAlpha = 0.3 + s.z * 0.25;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px, py, s.size * s.z * 0.4, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

const player = { x: 0, y: 0, angle: -Math.PI/2, vx: 0, vy: 0, radius: 14, thrust: false, fireCooldown: 0, invuln: 0, shield: 0, maxShield: 100, rapid: 0 };
function resetPlayer() {
  player.x = CX; player.y = CY;
  player.vx = player.vy = 0;
  player.angle = -Math.PI/2;
  player.invuln = 120;
  player.shield = kidMode ? 80 : 0;
  player.rapid = 0;
  player.fireCooldown = 0;
}
function updatePlayer() {
  let rot = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) rot -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) rot += 1;
  rot += gamepad.axes[0];
  player.angle += rot * 0.085;
  player.thrust = keys['ArrowUp'] || keys['KeyW'] || gamepad.buttons[0] || gamepad.buttons[7];
  if (player.thrust) {
    const force = 0.18;
    player.vx += Math.cos(player.angle) * force;
    player.vy += Math.sin(player.angle) * force;
    spawnTrail(player.x, player.y, player.angle, '#00F5FF');
    if (Math.random() < 0.4) spawnTrail(player.x, player.y, player.angle + 0.3, '#3A7BFF');
  }
  const maxSpeed = 7.5;
  const sp = Math.hypot(player.vx, player.vy);
  if (sp > maxSpeed) {
    player.vx = (player.vx / sp) * maxSpeed;
    player.vy = (player.vy / sp) * maxSpeed;
  }
  player.vx *= 0.992;
  player.vy *= 0.992;
  player.x += player.vx;
  player.y += player.vy;
  if (player.x < -20) player.x = W+20;
  if (player.x > W+20) player.x = -20;
  if (player.y < -20) player.y = H+20;
  if (player.y > H+20) player.y = -20;
  player.fireCooldown--;
  const firePressed = keys['Space'] || keys['KeyZ'] || gamepad.buttons[1] || gamepad.buttons[2];
  if (firePressed && player.fireCooldown <= 0) {
    const rate = player.rapid > 0 ? 6 : 12;
    player.fireCooldown = rate;
    const speed = 11;
    bullets.push({ x: player.x + Math.cos(player.angle)*18, y: player.y + Math.sin(player.angle)*18, vx: Math.cos(player.angle)*speed + player.vx*0.3, vy: Math.sin(player.angle)*speed + player.vy*0.3, life: 55, fromPlayer: true });
    spawnParticles(player.x + Math.cos(player.angle)*16, player.y + Math.sin(player.angle)*16, 4, '#00F5FF', 2, 12, 2);
  }
  if ((keys['ShiftLeft'] || keys['ShiftRight'] || gamepad.buttons[5]) && player.shield > 0) {
    player.shield = Math.max(0, player.shield - 0.6);
  }
  if (player.rapid > 0) player.rapid--;
  if (player.invuln > 0) player.invuln--;
  if (kidMode && player.shield < 40) player.shield = Math.min(100, player.shield + 0.15);
}
function drawPlayer() {
  if (player.invuln > 0 && Math.floor(player.invuln/4)%2) return;
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);
  if (player.shield > 5 && (keys['ShiftLeft']||keys['ShiftRight']||gamepad.buttons[5] || kidMode)) {
    ctx.beginPath();
    ctx.arc(0,0,22,0,Math.PI*2);
    ctx.strokeStyle = `rgba(58,123,255,${0.3 + player.shield/200})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = `rgba(58,123,255,0.08)`;
    ctx.fill();
  }
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.lineTo(-10, 9);
  ctx.lineTo(-6, 0);
  ctx.lineTo(-10, -9);
  ctx.closePath();
  ctx.fillStyle = '#0A1A2E';
  ctx.fill();
  ctx.strokeStyle = '#00F5FF';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(4, 0, 3.5, 0, Math.PI*2);
  ctx.fillStyle = '#00F5FF';
  ctx.globalAlpha = 0.8;
  ctx.fill();
  ctx.globalAlpha = 1;
  if (player.thrust) {
    ctx.beginPath();
    ctx.moveTo(-10, 5);
    ctx.lineTo(-18 - Math.random()*6, 0);
    ctx.lineTo(-10, -5);
    ctx.fillStyle = '#00F5FF';
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

const bullets = [];
function updateBullets() {
  for (let i=bullets.length-1; i>=0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy;
    b.life--;
    if (b.life <= 0 || b.x<-30||b.x>W+30||b.y<-30||b.y>H+30) {
      bullets.splice(i,1);
      continue;
    }
  }
}
function drawBullets() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets) {
    const col = b.fromPlayer ? '#00F5FF' : '#FF00AA';
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx*0.6, b.y - b.vy*0.6);
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

const asteroids = [];
function spawnAsteroid(x, y, size, speedMult=1) {
  const angle = Math.random()*Math.PI*2;
  const speed = (0.6 + Math.random()*1.2) * speedMult * (kidMode ? 0.7 : 1);
  asteroids.push({ x: x ?? Math.random()*W, y: y ?? Math.random()*H, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, size, radius: size === 3 ? 42 : size === 2 ? 24 : 12, rot: Math.random()*Math.PI*2, rotSpeed: (Math.random()-0.5)*0.04, verts: generateAsteroidVerts(size) });
}
function generateAsteroidVerts(size) {
  const n = 7 + size;
  const verts = [];
  for (let i=0; i<n; i++) {
    const a = (i/n)*Math.PI*2;
    const r = 0.7 + Math.random()*0.4;
    verts.push({ a, r });
  }
  return verts;
}
function updateAsteroids() {
  for (const a of asteroids) {
    a.x += a.vx; a.y += a.vy;
    a.rot += a.rotSpeed;
    if (a.x < -a.radius) a.x = W + a.radius;
    if (a.x > W + a.radius) a.x = -a.radius;
    if (a.y < -a.radius) a.y = H + a.radius;
    if (a.y > H + a.radius) a.y = -a.radius;
  }
}
function drawAsteroids() {
  for (const a of asteroids) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.beginPath();
    a.verts.forEach((v,i) => {
      const x = Math.cos(v.a) * a.radius * v.r;
      const y = Math.sin(v.a) * a.radius * v.r;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle = '#2A2A3A';
    ctx.fill();
    ctx.strokeStyle = '#00FFCC';
    ctx.lineWidth = 1.2;
    ctx.globalAlpha = 0.7;
    ctx.stroke();
    ctx.globalAlpha = 0.15;
    ctx.strokeStyle = '#00F5FF';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}
function splitAsteroid(a, idx) {
  spawnParticles(a.x, a.y, 18 + a.size*8, '#00FFCC', 4, 35, 3);
  spawnParticles(a.x, a.y, 10, '#FF5E00', 3, 25, 2);
  shake = Math.max(shake, 8 + a.size*4);
  flash = 0.35;
  score += a.size * 50 * wave;
  if (a.size > 1) {
    for (let i=0; i<2; i++) spawnAsteroid(a.x, a.y, a.size-1, 1.3);
  }
  if (Math.random() < (kidMode ? 0.22 : 0.12)) {
    powerups.push({ x: a.x, y: a.y, vx: (Math.random()-0.5)*1.5, vy: (Math.random()-0.5)*1.5, type: Math.random() < 0.5 ? 'shield' : 'rapid', life: 400, radius: 12 });
  }
  asteroids.splice(idx, 1);
}

const enemies = [];
function spawnEnemy() {
  const side = Math.floor(Math.random()*4);
  let x,y;
  if (side===0) { x=-30; y=Math.random()*H; }
  else if (side===1) { x=W+30; y=Math.random()*H; }
  else if (side===2) { x=Math.random()*W; y=-30; }
  else { x=Math.random()*W; y=H+30; }
  enemies.push({ x, y, vx:0, vy:0, angle: 0, radius: 16, fireCooldown: 60 + Math.random()*40, hp: 2 });
}
function updateEnemies() {
  for (let i=enemies.length-1; i>=0; i--) {
    const e = enemies[i];
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx,dy) || 1;
    const desired = Math.atan2(dy,dx);
    let da = desired - e.angle;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    e.angle += da * 0.04;
    const accel = 0.09 * (kidMode ? 0.7 : 1);
    e.vx += Math.cos(e.angle) * accel;
    e.vy += Math.sin(e.angle) * accel;
    e.vx *= 0.97; e.vy *= 0.97;
    e.x += e.vx; e.y += e.vy;
    e.fireCooldown--;
    if (e.fireCooldown <= 0 && dist < 450) {
      e.fireCooldown = kidMode ? 90 : 55;
      bullets.push({ x: e.x + Math.cos(e.angle)*14, y: e.y + Math.sin(e.angle)*14, vx: Math.cos(e.angle)*7, vy: Math.sin(e.angle)*7, life: 70, fromPlayer: false });
    }
    if (Math.random() < 0.3) spawnTrail(e.x, e.y, e.angle + Math.PI, '#FF00AA');
  }
}
function drawEnemies() {
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.angle);
    ctx.beginPath();
    ctx.moveTo(14,0);
    ctx.lineTo(-8,8);
    ctx.lineTo(-4,0);
    ctx.lineTo(-8,-8);
    ctx.closePath();
    ctx.fillStyle = '#1A0510';
    ctx.fill();
    ctx.strokeStyle = '#FF00AA';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(2,0,3,0,Math.PI*2);
    ctx.fillStyle = '#FF00AA';
    ctx.fill();
    ctx.restore();
  }
}

const powerups = [];
function updatePowerups() {
  for (let i=powerups.length-1; i>=0; i--) {
    const p = powerups[i];
    p.x += p.vx; p.y += p.vy;
    p.life--;
    if (p.life <= 0) { powerups.splice(i,1); continue; }
    if (kidMode) {
      const dx = player.x - p.x, dy = player.y - p.y;
      const d = Math.hypot(dx,dy);
      if (d < 120) {
        p.vx += dx/d * 0.08;
        p.vy += dy/d * 0.08;
      }
    }
  }
}
function drawPowerups() {
  for (const p of powerups) {
    const pulse = 0.7 + Math.sin(frame*0.15)*0.3;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(p.x, p.y);
    ctx.fillStyle = p.type === 'shield' ? '#3A7BFF' : '#00F5FF';
    ctx.globalAlpha = pulse;
    ctx.beginPath();
    ctx.arc(0,0,10,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.arc(0,0,16,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function checkCollisions() {
  for (let bi=bullets.length-1; bi>=0; bi--) {
    const b = bullets[bi];
    if (!b.fromPlayer) continue;
    for (let ai=asteroids.length-1; ai>=0; ai--) {
      const a = asteroids[ai];
      if (Math.hypot(b.x-a.x, b.y-a.y) < a.radius + 4) {
        bullets.splice(bi,1);
        splitAsteroid(a, ai);
        break;
      }
    }
  }
  for (let bi=bullets.length-1; bi>=0; bi--) {
    const b = bullets[bi];
    if (!b.fromPlayer) continue;
    for (let ei=enemies.length-1; ei>=0; ei--) {
      const e = enemies[ei];
      if (Math.hypot(b.x-e.x, b.y-e.y) < e.radius + 4) {
        bullets.splice(bi,1);
        e.hp--;
        spawnParticles(e.x, e.y, 8, '#FF00AA', 3, 20, 2);
        if (e.hp <= 0) {
          spawnParticles(e.x, e.y, 25, '#FF00AA', 5, 40, 3);
          spawnParticles(e.x, e.y, 12, '#FF5E00', 4, 30, 2);
          score += 250 * wave;
          shake = Math.max(shake, 12);
          flash = 0.4;
          enemies.splice(ei,1);
        }
        break;
      }
    }
  }
  if (player.invuln > 0) return;
  const shielding = (keys['ShiftLeft']||keys['ShiftRight']||gamepad.buttons[5] || kidMode) && player.shield > 5;
  for (const a of asteroids) {
    if (Math.hypot(player.x-a.x, player.y-a.y) < a.radius + player.radius) {
      if (shielding) {
        player.shield = Math.max(0, player.shield - 25);
        spawnParticles(player.x, player.y, 15, '#3A7BFF', 4, 25, 3);
        const dx = a.x - player.x, dy = a.y - player.y;
        const d = Math.hypot(dx,dy)||1;
        a.vx += dx/d * 2;
        a.vy += dy/d * 2;
      } else {
        playerHit();
        return;
      }
    }
  }
  for (const e of enemies) {
    if (Math.hypot(player.x-e.x, player.y-e.y) < e.radius + player.radius) {
      if (shielding) {
        player.shield = Math.max(0, player.shield - 40);
        spawnParticles(player.x, player.y, 20, '#3A7BFF', 5, 30, 3);
      } else {
        playerHit();
        return;
      }
    }
  }
  for (let bi=bullets.length-1; bi>=0; bi--) {
    const b = bullets[bi];
    if (b.fromPlayer) continue;
    if (Math.hypot(player.x-b.x, player.y-b.y) < player.radius + 5) {
      bullets.splice(bi,1);
      if (shielding) {
        player.shield = Math.max(0, player.shield - 15);
        spawnParticles(player.x, player.y, 8, '#3A7BFF', 3, 20, 2);
      } else {
        playerHit();
        return;
      }
    }
  }
  for (let i=powerups.length-1; i>=0; i--) {
    const p = powerups[i];
    if (Math.hypot(player.x-p.x, player.y-p.y) < player.radius + p.radius) {
      if (p.type === 'shield') player.shield = Math.min(player.maxShield, player.shield + 50);
      else player.rapid = 300;
      spawnParticles(p.x, p.y, 12, p.type==='shield'?'#3A7BFF':'#00F5FF', 3, 25, 2);
      powerups.splice(i,1);
      score += 100;
    }
  }
}
function playerHit() {
  lives--;
  spawnParticles(player.x, player.y, 40, '#00F5FF', 6, 50, 4);
  spawnParticles(player.x, player.y, 20, '#FF5E00', 5, 40, 3);
  shake = 25;
  flash = 0.7;
  if (lives <= 0) {
    endGame();
  } else {
    resetPlayer();
  }
}

function startWave() {
  const count = 3 + wave * 2;
  for (let i=0; i<count; i++) {
    let x,y;
    do {
      x = Math.random()*W; y = Math.random()*H;
    } while (Math.hypot(x-CX, y-CY) < 180);
    spawnAsteroid(x, y, 3);
  }
  if (wave > 1) {
    const ec = Math.min(1 + Math.floor(wave/2), 5);
    for (let i=0; i<ec; i++) setTimeout(() => spawnEnemy(), 800 + i*600);
  }
}
function checkWaveClear() {
  if (asteroids.length === 0 && enemies.length === 0 && state === State.PLAY) {
    wave++;
    setTimeout(startWave, 1500);
  }
}

function startGame() {
  score = 0; lives = 3; wave = 1;
  asteroids.length = 0; enemies.length = 0; bullets.length = 0;
  powerups.length = 0; particles.length = 0;
  resetPlayer();
  startWave();
  state = State.PLAY;
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('pause').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
}
function endGame() {
  state = State.GAMEOVER;
  highScores.push(score);
  highScores.sort((a,b)=>b-a);
  highScores = highScores.slice(0,10);
  localStorage.setItem('vc_scores', JSON.stringify(highScores));
  document.getElementById('finalScore').textContent = score.toLocaleString();
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('gameover').classList.remove('hidden');
}
function showMenu() {
  state = State.MENU;
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('pause').classList.add('hidden');
  document.getElementById('scores').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
}

document.getElementById('btnPlay').onclick = () => {
  kidMode = document.getElementById('kidMode').checked;
  startGame();
};
document.getElementById('btnScores').onclick = () => {
  const list = document.getElementById('hsList');
  list.innerHTML = highScores.length ? highScores.map((s,i)=>`<div class="hs-row"><span>#${i+1}</span><span>${s.toLocaleString()}</span></div>`).join('') : '<div class="hs-row">No scores yet</div>';
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('scores').classList.remove('hidden');
  state = State.SCORES;
};
document.getElementById('btnControls').onclick = () => {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('controls').classList.remove('hidden');
  state = State.CONTROLS;
};
document.getElementById('btnBackScores').onclick = showMenu;
document.getElementById('btnBackControls').onclick = showMenu;
document.getElementById('btnResume').onclick = () => {
  state = State.PLAY;
  document.getElementById('pause').classList.add('hidden');
};
document.getElementById('btnQuit').onclick = showMenu;
document.getElementById('btnRetry').onclick = startGame;
document.getElementById('btnMenu').onclick = showMenu;

window.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (state === State.PLAY) {
      state = State.PAUSE;
      document.getElementById('pause').classList.remove('hidden');
    } else if (state === State.PAUSE) {
      state = State.PLAY;
      document.getElementById('pause').classList.add('hidden');
    }
  }
});

function loop() {
  requestAnimationFrame(loop);
  frame++;
  pollGamepad();
  drawBackground();
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    shake *= 0.88;
  }
  if (state === State.PLAY || state === State.PAUSE) {
    if (state === State.PLAY) {
      updatePlayer();
      updateBullets();
      updateAsteroids();
      updateEnemies();
      updatePowerups();
      updateParticles();
      checkCollisions();
      checkWaveClear();
    }
    drawAsteroids();
    drawEnemies();
    drawPowerups();
    drawBullets();
    drawPlayer();
    drawParticles();
    document.getElementById('hudScore').textContent = score.toLocaleString();
    document.getElementById('hudWave').textContent = `WAVE ${wave}`;
    document.getElementById('hudLives').textContent = '▲ '.repeat(Math.max(0,lives)).trim() || '—';
    document.getElementById('shieldFill').style.width = (player.shield / player.maxShield * 100) + '%';
  } else {
    updateParticles();
    drawParticles();
  }
  ctx.restore();
  if (flash > 0) {
    flashEl.style.opacity = flash;
    flash *= 0.85;
  } else {
    flashEl.style.opacity = 0;
  }
}
loop();

for (let i=0; i<30; i++) {
  spawnParticles(Math.random()*W, Math.random()*H, 1, '#00F5FF', 0.3, 200, 1.5);
}
</script>
