<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VOID CASCADE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05010A;
    overflow: hidden;
    font-family: 'Orbitron', system-ui, sans-serif;
    color: #00F5FF;
    user-select: none;
    -webkit-user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #05010A;
    box-shadow: 0 0 80px rgba(0, 245, 255, 0.15);
  }
  #ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(26,10,46,0.85) 0%, rgba(5,1,10,0.95) 70%);
    pointer-events: auto;
    transition: opacity 0.4s ease;
  }
  #menu {
    background:
      radial-gradient(ellipse at center, rgba(5,1,10,0.10) 0%, rgba(5,1,10,0.42) 58%, rgba(5,1,10,0.78) 100%),
      url('../assets/backgrounds/menu_home.png') center / cover no-repeat;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .logo {
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    background: linear-gradient(90deg, #00F5FF, #FF00AA, #00F5FF);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s linear infinite;
    text-shadow: 0 0 40px rgba(0,245,255,0.5);
    margin-bottom: 0.3em;
  }
  #menu .logo {
    width: min(72vw, 560px);
    margin-bottom: 0.15rem;
    background: none;
    animation: none;
    text-shadow: none;
  }
  #menu .logo img {
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 0 22px rgba(0, 245, 255, 0.25));
  }
  @keyframes shimmer {
    to { background-position: 200% center; }
  }
  .tagline {
    font-size: 0.9rem;
    letter-spacing: 0.4em;
    color: #3A7BFF;
    margin-bottom: 3rem;
    opacity: 0.8;
  }
  .btn {
    pointer-events: auto;
    background: transparent;
    border: 2px solid #00F5FF;
    color: #00F5FF;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 0.9rem 2.8rem;
    margin: 0.6rem;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn:hover, .btn:focus {
    background: rgba(0,245,255,0.15);
    box-shadow: 0 0 30px rgba(0,245,255,0.4);
    transform: scale(1.05);
  }
  .btn.secondary {
    border-color: #3A7BFF;
    color: #3A7BFF;
    font-size: 0.85rem;
    padding: 0.6rem 1.8rem;
  }
  .btn.secondary:hover {
    background: rgba(58,123,255,0.15);
    box-shadow: 0 0 20px rgba(58,123,255,0.3);
  }
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 1.2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    font-size: 0.95rem;
    letter-spacing: 0.1em;
  }
  .hud-left, .hud-right { display: flex; flex-direction: column; gap: 0.3rem; }
  .score { font-size: 1.6rem; font-weight: 700; color: #00F5FF; text-shadow: 0 0 12px #00F5FF; }
  .lives { color: #FF00AA; }
  .wave { color: #3A7BFF; }
  .shield-bar {
    width: 120px; height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }
  .shield-fill {
    height: 100%;
    background: linear-gradient(90deg, #3A7BFF, #00F5FF);
    width: 0%;
    transition: width 0.15s;
  }
  #pauseHint {
    position: absolute;
    bottom: 1.5rem;
    font-size: 0.7rem;
    opacity: 0.4;
    letter-spacing: 0.15em;
  }
  .highscores {
    max-height: 40vh;
    overflow-y: auto;
    margin: 1.5rem 0;
    width: min(90vw, 360px);
  }
  .hs-row {
    display: flex;
    justify-content: space-between;
    padding: 0.4rem 1rem;
    border-bottom: 1px solid rgba(0,245,255,0.15);
    font-size: 0.9rem;
  }
  .hs-row:nth-child(1) { color: #00F5FF; font-weight: 700; }
  .kid-toggle {
    margin-top: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 0.85rem;
    color: #3A7BFF;
  }
  .kid-toggle input { accent-color: #00F5FF; width: 18px; height: 18px; }
  .menu-board {
    width: min(88vw, 320px);
    border: 1px solid rgba(0,245,255,0.25);
    background: rgba(0,245,255,0.04);
    padding: 0.7rem 0.4rem;
    margin-bottom: 1.6rem;
  }
  .menu-board-title {
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    color: #3A7BFF;
    text-align: center;
    margin-bottom: 0.4rem;
  }
  .menu-board .hs-row { font-size: 0.8rem; padding: 0.25rem 0.8rem; }
  .bindlist {
    width: min(90vw, 400px);
    margin: 1.2rem 0 0.6rem;
  }
  .bind-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.35rem 0.6rem;
    border-bottom: 1px solid rgba(0,245,255,0.12);
  }
  .bind-name { font-size: 0.8rem; letter-spacing: 0.15em; color: #aaa; }
  .bindkey {
    pointer-events: auto;
    background: rgba(0,245,255,0.06);
    border: 1px solid rgba(0,245,255,0.45);
    color: #00F5FF;
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 0.28rem 0.7rem;
    margin-left: 0.45rem;
    min-width: 3.6rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .bindkey:hover { background: rgba(0,245,255,0.18); box-shadow: 0 0 12px rgba(0,245,255,0.35); }
  .bindkey.listening {
    border-color: #FF00AA;
    color: #FF00AA;
    animation: listenPulse 0.8s ease-in-out infinite;
  }
  @keyframes listenPulse {
    50% { background: rgba(255,0,170,0.18); }
  }
  .bindhint { font-size: 0.65rem; letter-spacing: 0.15em; opacity: 0.45; margin-bottom: 0.8rem; }
  .go-hint {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    color: #FFD23F;
    min-height: 1.2em;
    margin-bottom: 1rem;
  }
  .name-entry { display: flex; align-items: center; margin-bottom: 1.2rem; }
  .name-entry.hidden { display: none; }
  .name-entry input {
    pointer-events: auto;
    background: rgba(0,245,255,0.06);
    border: 1px solid rgba(0,245,255,0.45);
    color: #00F5FF;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.7rem 1rem;
    width: 12.5rem;
    outline: none;
  }
  .name-entry input:focus { box-shadow: 0 0 18px rgba(0,245,255,0.35); }
  .name-entry input::placeholder { color: rgba(0,245,255,0.35); letter-spacing: 0.2em; }
  #fxLabel {
    position: absolute;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    color: #00F5FF;
    text-shadow: 0 0 12px #00F5FF;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="c"></canvas>
  <div id="fxLabel"></div>
  <div id="ui">
    <div id="menu" class="screen">
      <div class="logo"><img src="../assets/ui/void_cascade_banner.png" alt="VOID CASCADE"></div>
      <div class="tagline">SHATTER THE VOID</div>
      <div class="menu-board">
        <div class="menu-board-title">TOP PILOTS</div>
        <div id="menuScores"></div>
      </div>
      <button class="btn" id="btnPlay">PLAY</button>
      <button class="btn secondary" id="btnScores">HIGH SCORES</button>
      <button class="btn secondary" id="btnControls">CONTROLS</button>
      <div class="kid-toggle">
        <input type="checkbox" id="kidMode">
        <label for="kidMode">KID MODE (easier)</label>
      </div>
      <div id="pauseHint">ESC / START to pause • Gamepad supported</div>
    </div>
    <div id="scores" class="screen hidden">
      <div class="logo" style="font-size:2.5rem">HIGH SCORES</div>
      <div class="highscores" id="hsList"></div>
      <button class="btn secondary" id="btnBackScores">BACK</button>
    </div>
    <div id="controls" class="screen hidden">
      <div class="logo" style="font-size:2.2rem">CONTROLS</div>
      <div id="bindList" class="bindlist"></div>
      <div class="bindhint">Click a key to rebind it • B toggles bloom • M toggles sound • Gamepad supported</div>
      <button class="btn secondary" id="btnResetBinds">RESET TO DEFAULTS</button>
      <button class="btn secondary" id="btnBackControls">BACK</button>
    </div>
    <div id="pause" class="screen hidden">
      <div class="logo" style="font-size:3rem">PAUSED</div>
      <button class="btn" id="btnResume">RESUME</button>
      <button class="btn secondary" id="btnQuit">QUIT TO MENU</button>
    </div>
    <div id="gameover" class="screen hidden">
      <div class="logo" style="font-size:2.8rem">CASCADE COMPLETE</div>
      <div class="score" id="finalScore" style="margin:1rem 0 0.4rem">0</div>
      <div id="goHint" class="go-hint"></div>
      <div id="nameEntry" class="name-entry hidden">
        <input type="text" id="nameInput" maxlength="12" placeholder="PILOT NAME" autocomplete="off" spellcheck="false">
        <button class="btn secondary" id="btnSaveScore">SAVE</button>
      </div>
      <button class="btn" id="btnRetry">TRY AGAIN</button>
      <button class="btn secondary" id="btnMenu">MAIN MENU</button>
    </div>
    <div class="hud hidden" id="hud">
      <div class="hud-left">
        <div class="score" id="hudScore">0</div>
        <div class="wave" id="hudWave">WAVE 1</div>
      </div>
      <div class="hud-right">
        <div class="lives" id="hudLives">▲ ▲ ▲</div>
        <div style="font-size:0.6rem; letter-spacing:0.25em; color:#3A7BFF; margin-top:4px;">SHIELD</div>
        <div class="shield-bar"><div class="shield-fill" id="shieldFill"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="postfx.js"></script>
<script>
// VOID CASCADE — Browser Prototype
// Full modern particle-hybrid Asteroids remake
// (core gameplay + visual juice preserved from design)
//
// Rendering is two-stage: all gameplay draws into an offscreen 2D canvas,
// which is then pushed through the WebGL bloom pipeline in postfx.js and
// composited to the visible canvas. Game code below draws exactly as before.
const display = document.getElementById('c');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const postfx = createPostFX(display, canvas);

// Generated art is intentionally optional: the procedural renderers remain a
// graceful fallback if a local browser blocks image loading from file://.
const SPRITES = {
  player: new Image(),
  asteroid: new Image(),
  riftStalker: new Image(),
  shieldPickup: new Image(),
  rapidPickup: new Image()
};
SPRITES.player.src = '../assets/ships/player_default.png';
SPRITES.asteroid.src = '../assets/asteroids/large/asteroid_01.png';
SPRITES.riftStalker.src = '../assets/enemies/rift_stalker_01.png';
SPRITES.shieldPickup.src = '../assets/powerups/shield_charge.png';
SPRITES.rapidPickup.src = '../assets/powerups/rapid_fire.png';
const spriteSafety = new WeakMap();
function spriteReady(sprite) {
  if (!sprite.complete || sprite.naturalWidth <= 0) return false;
  // The local server is the supported playable route. Its assets are same
  // origin, so use them directly rather than falling back to the old Canvas
  // drawings. Only direct file:// launches need the taint-safety probe below.
  if (location.protocol !== 'file:') return true;
  if (spriteSafety.has(sprite)) return spriteSafety.get(sprite);
  // Canvas images loaded from a file URL can be cross-origin in some embedded
  // previews. Probe a disposable canvas first so they never taint the gameplay
  // source canvas and halt the WebGL post-processing frame.
  const probe = document.createElement('canvas');
  probe.width = probe.height = 1;
  try {
    const probeCtx = probe.getContext('2d');
    probeCtx.drawImage(sprite, 0, 0, 1, 1);
    probeCtx.getImageData(0, 0, 1, 1);
    spriteSafety.set(sprite, true);
  } catch (error) {
    spriteSafety.set(sprite, false);
    console.warn('Sprite disabled because this preview cannot safely upload it:', sprite.src, error);
  }
  return spriteSafety.get(sprite);
}

// Bloom is expensive at 4K. Cap the internal buffer so high-DPI screens do not
// tank the frame rate; the upscale is invisible under this much glow.
const MAX_PIXELS = 2100000;

let W = 0, H = 0, CX = 0, CY = 0;
function resize() {
  // Floor at 1x1. A page loaded in a background tab or a not-yet-laid-out
  // container reports 0, which would silently leave a zero-size canvas and a
  // black screen with no error.
  const w = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
  const h = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
  const scale = Math.min(1, Math.sqrt(MAX_PIXELS / (w * h)));
  const nw = Math.max(1, Math.floor(w * scale));
  const nh = Math.max(1, Math.floor(h * scale));
  if (nw === W && nh === H) return;
  W = canvas.width = display.width = nw;
  H = canvas.height = display.height = nh;
  display.style.width = w + 'px';
  display.style.height = h + 'px';
  CX = W / 2; CY = H / 2;
  postfx.resize(W, H);
}
window.addEventListener('resize', resize);
// The resize event does not fire when a hidden container is first laid out, so
// observe the container directly as well.
if (window.ResizeObserver) {
  new ResizeObserver(resize).observe(document.getElementById('gameContainer'));
}
resize();

// Look tuning, all in one place. Exposed on window so it can be adjusted live
// from the console without a reload: BLOOM.intensity = 2 and so on.
const BLOOM = window.BLOOM = {
  intensity: 1.6,   // how much of the bloom buffer is added back
  threshold: 0.40,  // brightness above which a pixel contributes glow
  knee: 0.15,       // softness of that cutoff; MUST stay below threshold, or
                    // the background itself leaks into the bloom and washes out
  radius: 1.0,      // tent filter spread during upsample; widens the halo
  aberration: 0.005,
  vignette: 0.5,
  kneeStart: 0.9,   // highlights below this are passed through untouched
  enabled: true     // toggled live with B, for A/B comparison
};

// Reused per-colour buckets for particle drawing. Allocated once so the render
// path does not create garbage every frame.
const particleBuckets = new Map();

const State = { MENU:0, PLAY:1, PAUSE:2, GAMEOVER:3, SCORES:4, CONTROLS:5 };
let state = State.MENU;
let kidMode = false;
let score = 0, lives = 3, wave = 1;
// Leaderboard entries are {name, score}. Older saves stored bare numbers, so
// migrate those on load rather than losing them.
let highScores = [];
try {
  highScores = (JSON.parse(localStorage.getItem('vc_scores') || '[]') || [])
    .map(e => typeof e === 'number' ? { name: 'PILOT', score: e } : e)
    .filter(e => e && typeof e.score === 'number' && typeof e.name === 'string');
} catch (e) { highScores = []; }
let shake = 0, flash = 0;
let frame = 0;

// dt is normalised so 1.0 == one tick at 60Hz. Everything that moves or counts
// down multiplies by it, so the game plays identically at 60, 120 and 144Hz.
// Clamped to 3 so an alt-tab pause cannot teleport asteroids through the ship.
let dt = 1, lastTime = 0;
// Brief freeze on heavy impacts. Costs a few frames, reads as weight.
let hitStop = 0;

const keys = {};
const gamepad = { axes: [0,0], buttons: {} };

// Rebindable controls. Each action has two slots; both fire it. Bindings are
// stored in localStorage and edited from the Controls screen.
const ACTIONS = [
  ['left',   'ROTATE LEFT'],
  ['right',  'ROTATE RIGHT'],
  ['thrust', 'THRUST'],
  ['fire',   'FIRE'],
  ['shield', 'SHIELD'],
  ['pause',  'PAUSE']
];
const DEFAULT_BINDS = {
  left:   ['ArrowLeft', 'KeyA'],
  right:  ['ArrowRight', 'KeyD'],
  thrust: ['ArrowUp', 'KeyW'],
  fire:   ['Space', 'KeyZ'],
  shield: ['ArrowDown', 'ShiftLeft'],
  pause:  ['Escape', 'KeyP']
};
let binds;
try {
  binds = { ...JSON.parse(localStorage.getItem('vc_binds') || 'null') };
} catch (e) { binds = null; }
for (const [a] of ACTIONS) {
  if (!binds || !Array.isArray(binds[a]) || binds[a].length !== 2) {
    binds = binds || {};
    binds[a] = [...DEFAULT_BINDS[a]];
  }
}
// Move the previous untouched default to Down Arrow without overriding a
// player's deliberate custom key binding.
if (binds.shield[0] === 'Backspace' && binds.shield[1] === 'ShiftLeft') {
  binds.shield[0] = 'ArrowDown';
  saveBinds();
}
function saveBinds() { localStorage.setItem('vc_binds', JSON.stringify(binds)); }
function down(action) { return binds[action].some(c => keys[c]); }
function shieldActive() { return down('shield') || gamepad.buttons[5]; }

// While the Controls screen is waiting for a key, this holds {action, slot}.
// The capture listener below swallows the keypress so it cannot also pause the
// game or scroll the page.
let rebinding = null;
window.addEventListener('keydown', e => {
  if (!rebinding) return;
  e.preventDefault();
  e.stopPropagation();
  if (e.code !== 'Escape') {
    binds[rebinding.action][rebinding.slot] = e.code;
    saveBinds();
  }
  rebinding = null;
  renderBinds();
}, true);

window.addEventListener('keydown', e => {
  // Never intercept typing in a text field (leaderboard name entry) — the
  // Backspace/Space suppression below would make the input uneditable.
  if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  keys[e.code] = true;
  // Backspace must be suppressed or some browsers treat it as history-back
  // mid-game, which would be a disastrous default for a shield key.
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Backspace'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.code] = false);

// ---- Audio: fully procedural WebAudio, zero asset files ----
// Everything is synthesised so the game keeps working straight off the
// filesystem. The context can only start after a user gesture, so init() is
// called from the first click/keypress and every play() call is a no-op until
// then. M mutes, persisted in localStorage.
const AudioFX = (() => {
  let ac = null, master, sfx, musGain;
  let noiseBuf, thrustGain, thrustFilter;
  let muted = localStorage.getItem('vc_muted') === '1';
  let musicOn = false, schedTimer = null, nextNoteTime = 0, step = 0;

  function init() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = muted ? 0 : 1;
    master.connect(ac.destination);
    sfx = ac.createGain(); sfx.gain.value = 0.55; sfx.connect(master);
    musGain = ac.createGain(); musGain.gain.value = 0; musGain.connect(master);

    // one second of white noise, reused by every noise-based sound
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    // Thruster: looped noise through a low-pass, gain ridden by setThrust().
    // A continuous node with a smoothed gain avoids clicks from restarting.
    const src = ac.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    thrustFilter = ac.createBiquadFilter();
    thrustFilter.type = 'lowpass'; thrustFilter.frequency.value = 240; thrustFilter.Q.value = 0.7;
    thrustGain = ac.createGain(); thrustGain.gain.value = 0;
    src.connect(thrustFilter); thrustFilter.connect(thrustGain); thrustGain.connect(sfx);
    src.start();

    startScheduler();
  }
  function resume() { if (ac && ac.state === 'suspended') ac.resume(); }

  function env(g, t, attack, peak, decay) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0011), t + attack);
    g.gain.exponentialRampToValueAtTime(0.001, t + attack + decay);
  }
  function osc(type, f0, f1, t, dur, peak, dest) {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    const g = ac.createGain(); env(g, t, 0.006, peak, dur);
    o.connect(g); g.connect(dest || sfx);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, peak, fType, f0, f1) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = fType;
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); env(g, t, 0.008, peak, dur);
    s.connect(f); f.connect(g); g.connect(sfx);
    s.start(t); s.stop(t + dur + 0.05);
  }

  // ---- music: dark 4-bar synth loop (Am F C G), 8th-note lookahead scheduler
  const ROOTS = [55, 43.65, 65.41, 49];
  const EIGHTH = 0.29;
  function scheduleStep(s, t) {
    const root = ROOTS[Math.floor(s / 8) % 4];
    if (s % 2 === 0) osc('triangle', root, root, t, 0.26, 0.5, musGain);       // bass pulse
    const arp = [2, 3, 4, 6, 4, 3][s % 6];
    osc('sine', root * arp * 2, root * arp * 2, t, 0.14, 0.10, musGain);       // arpeggio
    if (s % 4 === 2) {                                                          // soft tick

const particles = [];
function spawnParticles(x, y, count, color, speed=3, life=40, size=3) {

    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: life * (0.6 + Math.random()*0.5), maxLife: life, size: size * (0.5 + Math.random()), color, glow: true });

const stars = [];

}
const nebulaBlobs = [];
for (let i=0; i<8; i++) {
  nebulaBlobs.push({ x: Math.random()*W, y: Math.random()*H, r: 120 + Math.random()*200, vx: (Math.random()-0.5)*0.15, vy: (Math.random()-0.5)*0.15, hue: 260 + Math.random()*40 });

// Scroll accumulator rather than raw frame count, so parallax speed is also
// frame-rate independent.
let bgScroll = 0;

function drawBackground() {
  bgScroll += dt;
  ctx.fillStyle = '#05010A';
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const n of nebulaBlobs) {
    n.x += n.vx * dt; n.y += n.vy * dt;
    if (n.x < -n.r) n.x = W+n.r;
    if (n.x > W+n.r) n.x = -n.r;
    if (n.y < -n.r) n.y = H+n.r;
    if (n.y > H+n.r) n.y = -n.r;
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, `hsla(${n.hue},70%,40%,0.12)`);
    g.addColorStop(0.5, `hsla(${n.hue},60%,25%,0.05)`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // flat void and the ship looks like it is sliding on glass; the grid gives
  // motion something to register against. Kept under the bloom threshold so it
  // never glows and never competes with gameplay elements.
  const cell = 90;
  const ox = (bgScroll * 0.18) % cell;
  const oy = (bgScroll * 0.09) % cell;
  ctx.save();
  ctx.strokeStyle = '#3A7BFF';
  ctx.globalAlpha = 0.055;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = -ox; x < W + cell; x += cell) {
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  for (let y = -oy; y < H + cell; y += cell) {
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();
  ctx.restore();

  for (const s of stars) {
    const px = (s.x * W + bgScroll * 0.02 * s.z) % W;
    const py = (s.y * H + bgScroll * 0.01 * s.z) % H;
    ctx.globalAlpha = 0.3 + s.z * 0.25;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px, py, s.size * s.z * 0.4, 0, Math.PI*2);
    ctx.fill();

  }
  if (Math.random() < (kidMode ? 0.22 : 0.12)) {
    powerups.push({ x: a.x, y: a.y, vx: (Math.random()-0.5)*1.5, vy: (Math.random()-0.5)*1.5, type: Math.random() < 0.5 ? 'shield' : 'rapid', life: 400, radius: 12 });
  }
  asteroids.splice(idx, 1);
}

const enemies = [];
function spawnEnemy() {
  const side = Math.floor(Math.random()*4);
  let x,y;
  if (side===0) { x=-30; y=Math.random()*H; }
  else if (side===1) { x=W+30; y=Math.random()*H; }
  else if (side===2) { x=Math.random()*W; y=-30; }
  else { x=Math.random()*W; y=H+30; }
  enemies.push({ x, y, vx:0, vy:0, angle: 0, radius: 16, fireCooldown: 120 + Math.random()*60, hp: 2, seed: Math.random()*Math.PI*2 });
}
function updateEnemies() {
  for (let i=enemies.length-1; i>=0; i--) {
    const e = enemies[i];
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx,dy) || 1;
    const desired = Math.atan2(dy,dx);
    let da = desired - e.angle;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    // Deliberately sluggish hunters: slow turn, gentle acceleration, long
    // refire and a shorter attack range, so they pressure rather than swarm.
    e.angle += da * 0.022 * dt;
    const accel = 0.05 * (kidMode ? 0.7 : 1);
    e.vx += Math.cos(e.angle) * accel * dt;
    e.vy += Math.sin(e.angle) * accel * dt;
    const eDrag = Math.pow(0.97, dt);
    e.vx *= eDrag; e.vy *= eDrag;
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.fireCooldown -= dt;
    if (e.fireCooldown <= 0 && dist < 360) {
      e.fireCooldown = kidMode ? 170 : 110;
      bullets.push({ x: e.x + Math.cos(e.angle)*14, y: e.y + Math.sin(e.angle)*14, vx: Math.cos(e.angle)*5.2, vy: Math.sin(e.angle)*5.2, life: 90, fromPlayer: false });
    }
    // spawnTrail already offsets backwards along the given angle; the old
    // +PI here was putting the exhaust in FRONT of the enemy.
    if (Math.random() < 0.25) spawnTrail(e.x, e.y, e.angle, '#FF00AA');
  }
}
// Rift Stalkers read as a different species from the player: curved manta
// silhouette against the player's hard angles, magenta against cyan, and a
// pulsing energy core instead of a cockpit.
function drawEnemies() {
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.angle);

    const pulse = 0.65 + 0.35 * Math.sin(frame * 0.18 + e.seed);

    if (spriteReady(SPRITES.riftStalker)) {
      // The generated ship faces right, matching the simulation's +X heading.
      // A slight pulse gives its magenta core life without baking another glow.
      const size = 48;
      ctx.globalAlpha = 0.9 + pulse * 0.1;
      ctx.drawImage(SPRITES.riftStalker, -size / 2, -size / 2, size, size);
      ctx.restore();
      continue;
    }

    // Manta hull: swept-back curved wings with a rear notch.
    const hull = ctx.createLinearGradient(0, -12, 0, 12);
    hull.addColorStop(0, '#2A1030');
    hull.addColorStop(0.5, '#160A1C');
    hull.addColorStop(1, '#0C0512');
    ctx.beginPath();
    ctx.moveTo(11, 0);
    ctx.quadraticCurveTo(2, -13, -12, -10);
    ctx.quadraticCurveTo(-5, -4, -8, 0);
    ctx.quadraticCurveTo(-5, 4, -12, 10);
    ctx.quadraticCurveTo(2, 13, 11, 0);
    ctx.closePath();
    ctx.fillStyle = hull;
    ctx.fill();
    ctx.strokeStyle = '#FF00AA';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Wingtip barbs
    for (const s of [1, -1]) {
      ctx.beginPath();
      ctx.arc(-11, 9.5*s, 1.3, 0, Math.PI*2);
      ctx.fillStyle = '#FF00AA';
      ctx.fill();
    }

    // Pulsing rift core
    const core = ctx.createRadialGradient(0, 0, 0.5, 0, 0, 6.5*pulse);
    core.addColorStop(0, '#FFE0F4');
    core.addColorStop(0.35, '#FF00AA');
    core.addColorStop(1, 'rgba(255,0,170,0)');
    ctx.beginPath();
    ctx.arc(0, 0, 6.5*pulse, 0, Math.PI*2);
    ctx.fillStyle = core;
    ctx.fill();

    ctx.restore();
  }
}

const powerups = [];
function updatePowerups() {
  for (let i=powerups.length-1; i>=0; i--) {
    const p = powerups[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) { powerups.splice(i,1); continue; }
    if (kidMode) {
      const dx = player.x - p.x, dy = player.y - p.y;
      const d = Math.hypot(dx,dy);
      if (d < 120) {
        p.vx += dx/d * 0.08 * dt;
        p.vy += dy/d * 0.08 * dt;
      }
    }
  }
}
function drawPowerups() {
  for (const p of powerups) {
    const pulse = 0.7 + Math.sin(frame*0.15)*0.3;
    ctx.save();
    ctx.translate(p.x, p.y);
    const sprite = p.type === 'shield' ? SPRITES.shieldPickup : SPRITES.rapidPickup;
    if (spriteReady(sprite)) {
      const size = 52;
      ctx.globalAlpha = 0.78 + pulse * 0.22;
      ctx.drawImage(sprite, -size / 2, -size / 2, size, size);
      // Retain a small procedural aura to make the collectible pulse in play.
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.16 + pulse * 0.12;
      ctx.fillStyle = p.type === 'shield' ? '#3A7BFF' : '#00F5FF';
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      continue;
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = p.type === 'shield' ? '#3A7BFF' : '#00F5FF';
    ctx.globalAlpha = pulse;
    ctx.beginPath();
    ctx.arc(0,0,10,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.arc(0,0,16,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function checkCollisions() {
  for (let bi=bullets.length-1; bi>=0; bi--) {
    const b = bullets[bi];
    if (!b.fromPlayer) continue;
    for (let ai=asteroids.length-1; ai>=0; ai--) {
      const a = asteroids[ai];
      if (Math.hypot(b.x-a.x, b.y-a.y) < a.radius + 4) {
        bullets.splice(bi,1);
        splitAsteroid(a, ai);
        break;
      }
    }
  }
  for (let bi=bullets.length-1; bi>=0; bi--) {
    const b = bullets[bi];
    if (!b.fromPlayer) continue;
    for (let ei=enemies.length-1; ei>=0; ei--) {
      const e = enemies[ei];
      if (Math.hypot(b.x-e.x, b.y-e.y) < e.radius + 4) {
        bullets.splice(bi,1);
        e.hp--;
        spawnParticles(e.x, e.y, 8, '#FF00AA', 3, 20, 2);
        if (e.hp <= 0) {
          spawnParticles(e.x, e.y, 55, '#FF00AA', 6, 44, 3.2);
          spawnParticles(e.x, e.y, 24, '#FF5E00', 4, 32, 2.4);
          spawnParticles(e.x, e.y, 14, '#FFFFFF', 8, 15, 2);
          AudioFX.enemyBoom();
          score += 250 * wave;
          shake = Math.max(shake, 14);
          flash = 0.4;
          hitStop = Math.max(hitStop, 4);
          enemies.splice(ei,1);
        }
        break;
      }
    }
  }
  if (player.invuln > 0) return;
  const shielding = (shieldActive() || kidMode) && player.shield > 5;
  // Shield-ramming an asteroid destroys it (full split, scores normally) at a
  // fixed shield cost. One per frame: splitAsteroid mutates the array, so we
  // handle the first hit and break rather than keep iterating stale indices.
  for (let ai = asteroids.length - 1; ai >= 0; ai--) {
    const a = asteroids[ai];
    if (Math.hypot(player.x-a.x, player.y-a.y) < a.radius + player.radius) {
      if (shielding) {
        player.shield = Math.max(0, player.shield - (8 + a.size * 5));
        spawnParticles(player.x, player.y, 15, '#3A7BFF', 4, 25, 3);
        AudioFX.shieldHit();
        splitAsteroid(a, ai);
        break;
      } else {
        playerHit();
        return;
      }
    }
  }
  for (const e of enemies) {
    if (Math.hypot(player.x-e.x, player.y-e.y) < e.radius + player.radius) {
      if (shielding) {
        player.shield = Math.max(0, player.shield - 40);
        spawnParticles(player.x, player.y, 20, '#3A7BFF', 5, 30, 3);
        AudioFX.shieldHit();
      } else {
        playerHit();
        return;
      }
    }
  }
  for (let bi=bullets.length-1; bi>=0; bi--) {
    const b = bullets[bi];
    if (b.fromPlayer) continue;
    if (Math.hypot(player.x-b.x, player.y-b.y) < player.radius + 5) {
      bullets.splice(bi,1);
      if (shielding) {
        player.shield = Math.max(0, player.shield - 15);
        spawnParticles(player.x, player.y, 8, '#3A7BFF', 3, 20, 2);
        AudioFX.shieldHit();
      } else {
        playerHit();
        return;
      }
    }
  }
  for (let i=powerups.length-1; i>=0; i--) {
    const p = powerups[i];
    if (Math.hypot(player.x-p.x, player.y-p.y) < player.radius + p.radius) {
      if (p.type === 'shield') player.shield = Math.min(player.maxShield, player.shield + 50);
      else player.rapid = 300;
      AudioFX.pickup();
      spawnParticles(p.x, p.y, 12, p.type==='shield'?'#3A7BFF':'#00F5FF', 3, 25, 2);
      powerups.splice(i,1);
      score += 100;
    }
  }
}
function playerHit() {
  lives--;
  spawnParticles(player.x, player.y, 30, '#FFFFFF', 9, 18, 2.5);
  spawnParticles(player.x, player.y, 60, '#FFD23F', 7, 45, 3.6);
  spawnParticles(player.x, player.y, 55, '#FF5E00', 5, 50, 3.4);
  spawnParticles(player.x, player.y, 25, '#C22800', 2.5, 65, 4);
  spawnParticles(player.x, player.y, 20, '#00F5FF', 6, 40, 2.5); // ship debris sparks
  shake = 25;
  flash = 0.7;
  hitStop = 8;
  if (lives <= 0) {
    // Final death gets the game-over sting (played in endGame), not the
    // ordinary death boom — the two must not stack.
    endGame();
  } else {
    AudioFX.playerBoom();
    resetPlayer();
  }
}

// Every pending spawn timer, so a restart or a quit to menu can cancel them.
// Without this, enemies queued by the previous run keep arriving after you die,
// on the menu, and into the next game.
const pendingTimers = new Set();
function later(fn, ms) {
  const id = setTimeout(() => { pendingTimers.delete(id); fn(); }, ms);
  pendingTimers.add(id);
  return id;
}
function clearPendingTimers() {
  for (const id of pendingTimers) clearTimeout(id);
  pendingTimers.clear();
}

// True while the next wave is queued but has not spawned yet.
let waveTransition = false;

function startWave() {
  waveTransition = false;
  const count = 3 + wave * 2;
  for (let i=0; i<count; i++) {
    let x,y;
    do {
      x = Math.random()*W; y = Math.random()*H;
    } while (Math.hypot(x-CX, y-CY) < 180);
    spawnAsteroid(x, y, 3);
  }
  // Rift Stalkers arrive from wave 3, one at first, capped at 3, spaced well
  // apart — pressure, not a swarm.
  if (wave > 2) {
    const ec = Math.min(1 + Math.floor((wave - 3) / 2), 3);
    for (let i=0; i<ec; i++) later(spawnEnemy, 1200 + i*1500);
  }
}
function checkWaveClear() {
  // The guard is essential. This runs every frame, but the next wave is on a
  // 1500ms timer, so without it the field-is-empty condition stays true for
  // ~90 frames at 60Hz: wave incremented 90 times and 90 spawns were queued,
  // turning a cleared wave 1 into wave 91 and 450 enemies arriving at once.
  if (waveTransition) return;
  if (asteroids.length === 0 && enemies.length === 0 && state === State.PLAY) {
    waveTransition = true;
    wave++;
    later(startWave, 1500);
  }
}

function startGame() {
  clearPendingTimers();
  waveTransition = false;
  hitStop = 0; shake = 0; flash = 0;
  score = 0; lives = 3; wave = 1;
  asteroids.length = 0; enemies.length = 0; bullets.length = 0;
  powerups.length = 0; particles.length = 0;
  resetPlayer();
  startWave();
  state = State.PLAY;
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('pause').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
}
function endGame() {
  clearPendingTimers();
  waveTransition = false;
  state = State.GAMEOVER;
  AudioFX.setMusic(false);
  AudioFX.gameOver();
  document.getElementById('finalScore').textContent = score.toLocaleString();
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('gameover').classList.remove('hidden');
  // Name entry only when the run actually places on the board.
  const qualifies = score > 0 && (highScores.length < 10 || score > highScores[highScores.length - 1].score);
  document.getElementById('nameEntry').classList.toggle('hidden', !qualifies);
  document.getElementById('goHint').textContent = qualifies ? 'NEW HIGH SCORE — ENTER YOUR NAME' : '';
  if (qualifies) {
    const inp = document.getElementById('nameInput');
    inp.value = localStorage.getItem('vc_name') || '';
    setTimeout(() => inp.focus(), 60);
  }
}
function saveScore() {
  const entry = document.getElementById('nameEntry');
  if (entry.classList.contains('hidden')) return;   // guard against double-submit
  const name = (document.getElementById('nameInput').value.trim() || 'PILOT').toUpperCase().slice(0, 12);
  localStorage.setItem('vc_name', name);
  highScores.push({ name, score });
  highScores.sort((a, b) => b.score - a.score);
  highScores = highScores.slice(0, 10);
  localStorage.setItem('vc_scores', JSON.stringify(highScores));
  entry.classList.add('hidden');
  document.getElementById('goHint').textContent = 'SCORE SAVED';
  renderMenuScores();
}
function showMenu() {
  clearPendingTimers();
  waveTransition = false;
  rebinding = null;
  renderMenuScores();
  state = State.MENU;
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('pause').classList.add('hidden');
  document.getElementById('scores').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
}

document.getElementById('btnPlay').onclick = () => {
  kidMode = document.getElementById('kidMode').checked;
  startGame();
};
document.getElementById('btnScores').onclick = () => {
  const list = document.getElementById('hsList');
  list.innerHTML = highScores.length ? highScores.map(hsRow).join('') : '<div class="hs-row">No scores yet</div>';
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('scores').classList.remove('hidden');
  state = State.SCORES;
};
document.getElementById('btnControls').onclick = () => {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('controls').classList.remove('hidden');
  state = State.CONTROLS;
};
document.getElementById('btnBackScores').onclick = showMenu;
document.getElementById('btnBackControls').onclick = showMenu;
document.getElementById('btnResume').onclick = () => {
  state = State.PLAY;
  document.getElementById('pause').classList.add('hidden');
};
document.getElementById('btnQuit').onclick = showMenu;
document.getElementById('btnRetry').onclick = startGame;
document.getElementById('btnMenu').onclick = showMenu;
document.getElementById('btnSaveScore').onclick = saveScore;
document.getElementById('nameInput').addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') saveScore();
});

// B toggles the whole post chain on and off mid-frame, so the effect can be
// judged by flipping it during play rather than by comparing screenshots.
const fxLabel = document.getElementById('fxLabel');
let fxLabelTimer = 0;
function flashFxLabel(text) {
  fxLabel.textContent = text;
  fxLabel.style.opacity = '1';
  clearTimeout(fxLabelTimer);
  fxLabelTimer = setTimeout(() => { fxLabel.style.opacity = '0'; }, 1100);
}
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.code === 'KeyB') {
    BLOOM.enabled = !BLOOM.enabled;
    flashFxLabel('BLOOM ' + (BLOOM.enabled ? 'ON' : 'OFF'));
  }
  if (e.code === 'KeyM') {
    flashFxLabel('SOUND ' + (AudioFX.toggleMute() ? 'OFF' : 'ON'));
  }
});

window.addEventListener('keydown', e => {
  if (binds.pause.includes(e.code)) {
    if (state === State.PLAY) {
      state = State.PAUSE;
      document.getElementById('pause').classList.remove('hidden');
    } else if (state === State.PAUSE) {
      state = State.PLAY;
      document.getElementById('pause').classList.add('hidden');
    }
  }
});

// ---- Controls screen: rebindable keys ----
const KEY_LABELS = { Space:'SPACE', Backspace:'BKSP', ShiftLeft:'SHIFT', ShiftRight:'R-SHIFT', Escape:'ESC', ControlLeft:'CTRL', ControlRight:'R-CTRL', AltLeft:'ALT', Tab:'TAB', Enter:'ENTER', ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT' };
function keyLabel(code) {
  return KEY_LABELS[code] || code.replace(/^(Key|Digit|Numpad)/, '').toUpperCase();
}
function renderBinds() {
  const list = document.getElementById('bindList');
  list.innerHTML = ACTIONS.map(([a, label]) =>
    `<div class="bind-row"><span class="bind-name">${label}</span><span>` +
    binds[a].map((c, i) => {
      const active = rebinding && rebinding.action === a && rebinding.slot === i;
      return `<button class="bindkey${active ? ' listening' : ''}" data-a="${a}" data-i="${i}">${active ? 'PRESS…' : keyLabel(c)}</button>`;
    }).join('') + `</span></div>`
  ).join('');
  list.querySelectorAll('.bindkey').forEach(btn => {
    btn.onclick = () => {
      rebinding = { action: btn.dataset.a, slot: +btn.dataset.i };
      renderBinds();
    };
  });
}
document.getElementById('btnResetBinds').onclick = () => {
  for (const [a] of ACTIONS) binds[a] = [...DEFAULT_BINDS[a]];
  saveBinds();
  rebinding = null;
  renderBinds();
};

// ---- Home screen leaderboard ----
// Names are user text going into innerHTML — escape them.
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hsRow(e, i) {
  return `<div class="hs-row"><span>#${i+1} ${esc(e.name)}</span><span>${e.score.toLocaleString()}</span></div>`;
}
function renderMenuScores() {
  const el = document.getElementById('menuScores');
  el.innerHTML = highScores.length
    ? highScores.slice(0, 5).map(hsRow).join('')
    : '<div class="hs-row"><span>NO SCORES YET</span><span>—</span></div>';
}
renderMenuScores();
renderBinds();

function loop(now) {
  requestAnimationFrame(loop);

  // Normalise elapsed time to 60Hz ticks. The clamp stops a backgrounded tab
  // from resuming with one enormous step that tunnels collisions.
  if (!lastTime) lastTime = now || 0;
  const elapsed = (now || 0) - lastTime;
  lastTime = now || 0;
  dt = Math.min(elapsed / 16.6667, 3) || 1;

  frame += dt;
  pollGamepad();
  AudioFX.setMusic(state === State.PLAY);
  AudioFX.setThrust(state === State.PLAY && player.thrust);

  // Hit-stop: keep rendering, suspend simulation. Reads as impact weight.
  const frozen = hitStop > 0;
  if (frozen) hitStop -= dt;

  drawBackground();
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    shake *= Math.pow(0.88, dt);
    if (shake < 0.1) shake = 0;
  }
  if (state === State.PLAY || state === State.PAUSE) {
    if (state === State.PLAY && !frozen) {
      updatePlayer();
      updateBullets();
      updateAsteroids();
      updateEnemies();
      updatePowerups();
      updateParticles();
      checkCollisions();
      checkWaveClear();
    }
    drawAsteroids();
    drawEnemies();
    drawPowerups();
    drawBullets();
    drawPlayer();
    drawParticles();
    document.getElementById('hudScore').textContent = score.toLocaleString();
    document.getElementById('hudWave').textContent = `WAVE ${wave}`;
    document.getElementById('hudLives').textContent = '▲ '.repeat(Math.max(0,lives)).trim() || '—';
    document.getElementById('shieldFill').style.width = (player.shield / player.maxShield * 100) + '%';
  } else {
    updateParticles();
    drawParticles();
  }
  ctx.restore();

  if (flash > 0) {
    flash *= Math.pow(0.85, dt);
    if (flash < 0.005) flash = 0;
  }

  // Everything drawn above lands in the offscreen canvas. This is the step
  // that actually turns it into the look: bright pass, two blur octaves,
  // additive composite, chromatic aberration, vignette.
  postfx.render({
    bloomIntensity: BLOOM.enabled ? BLOOM.intensity : 0,
    threshold: BLOOM.threshold,
    knee: BLOOM.knee,
    radius: BLOOM.radius,
    aberration: BLOOM.aberration + shake * 0.0012,
    vignette: BLOOM.vignette,
    kneeStart: BLOOM.kneeStart,
    flash: flash * 0.85
  });
}
requestAnimationFrame(loop);

for (let i=0; i<30; i++) {
  spawnParticles(Math.random()*W, Math.random()*H, 1, '#00F5FF', 0.3, 200, 1.5);
}
</script>
